# Runs the automated tests and the data validator on every push and pull request.
name: Tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Trust data is current
        run: python3 -I tools/build_trust.py && git diff --exit-code data/trust.json
      - name: Tests
        run: npm test
