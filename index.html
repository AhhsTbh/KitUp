.thr{display:grid;gap:7px;align-content:start;padding:14px;border-radius:12px;border:1px solid color-mix(in srgb,var(--nerf) 35%,var(--line));background:linear-gradient(170deg,color-mix(in srgb,var(--nerf) 9%,var(--surface)),var(--surface) 65%)}
.thr-ic svg{width:28px;height:28px;fill:none;stroke:var(--nerf);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.thr h3{font-size:1.3rem;font-weight:800}
.thr p{color:var(--muted);font-size:.93rem}
.fob{display:grid;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.fob-r{display:grid;grid-template-columns:6.4rem minmax(0,1fr);gap:12px;padding:11px 13px;border-bottom:1px solid var(--line)}
.fob-r:last-child{border-bottom:0}
.fob-w{font:600 .64rem/1.5 var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--buff)}
.fob-r.lk .fob-w{color:var(--accent-text)}
.fob-t{display:grid;gap:2px}
.fob-t b{font-weight:700}
.fob-t small{color:var(--muted);font-size:.88rem}
.dtags{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
@media (min-width:640px){.dtags{grid-template-columns:repeat(6,minmax(0,1fr))}}
.dtag{display:grid;gap:5px;justify-items:start;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.dtag i{width:100%;height:8px;border-radius:4px;background:var(--c)}
.dtag b{font:800 1.02rem/1 var(--f-display);text-transform:uppercase;letter-spacing:.02em}
.dtag small{font:500 .56rem/1 var(--f-mono);letter-spacing:.06em;color:var(--muted)}
.dt-0{--c:linear-gradient(90deg,#6E777D,#A9B1B6)}
.dt-1{--c:linear-gradient(90deg,#7A4D2B,#C88A55)}
.dt-2{--c:linear-gradient(90deg,#9AA1A8,#E4E8EC)}
.dt-3{--c:linear-gradient(90deg,#A57A1E,#F0CF6A)}
.dt-4{--c:repeating-linear-gradient(115deg,#6C6A7A 0 4px,#B8B4C8 4px 7px,#4B4858 7px 11px)}
.dt-5{--c:linear-gradient(90deg,#0D0B12,#3A3446)}
.dt-5 i{box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.trees{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.tree{display:grid;gap:4px;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--raised)}
.tree b{font:800 1.05rem/1 var(--f-display);text-transform:uppercase;letter-spacing:.02em}
.tree small{font:500 .58rem/1.3 var(--f-mono);letter-spacing:.04em;color:var(--muted)}
.pcost{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.pcost div{display:grid;gap:5px;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.pcost small{font:500 .58rem/1.2 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.pcost b{font:800 1.25rem/1 var(--f-display);color:var(--gold-text);font-variant-numeric:tabular-nums}
@media (max-width:380px){.facts{grid-template-columns:repeat(2,minmax(0,1fr))}.inf{grid-template-columns:6.8rem minmax(0,1fr) 4.2rem}}
</style>

  </div>
</header>

    <button class="tab" data-go="camos" data-tab="camos"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><path d="M7.5 3.8c-.6 2.6 1 4.4 3.6 4.1 2.2-.3 3 1.6 2.3 3.4M3.8 14c2.4-.9 4.6.2 5 2.4.3 1.9 2 2.9 3.9 2.4M20.2 11.5c-2.3.2-3.6 1.8-3 3.9.4 1.4-.1 3-1.2 4.8"/></svg>Camos</button>
    <button class="tab" data-go="meta" data-tab="meta"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21c-3.9 0-6.5-2.6-6.5-6.2 0-3.4 2.4-5.4 3.7-7.8.4 1.7 1.3 2.9 2.6 3.5.2-3 1.6-5.5 3.9-7 0 2.9 1.4 4.5 2.6 6.1 1 1.4 1.7 2.9 1.7 4.8 0 3.9-3.2 6.6-8 6.6z"/></svg>Meta</button>

    <button class="btn" data-act="unlock-close" id="unlock-ok">Let's go</button>

<script>
(() => {
'use strict';

const S = {
  g: null, news: [], patches: [], shop: { date: null, items: [] }, meta: [],
  W: {}, C: {}, view: 'home', gun: null, cat: 'all', q: '', sort: 'unlock', L: null,
  lvl: null, vs: ['han-86', 'm4'], apexPeek: false, road: null, cardBlob: null
};
const KEY = 'lhq.loadouts.v1', LVLKEY = 'lhq.level.v1';
const viewEl = document.getElementById('view');
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const TYPE_LABEL = { buff: 'Buff', nerf: 'Nerf', adjust: 'Change' };
let inFrame = true; try { inFrame = window.top !== window.self; } catch (e) {}

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const byId = (list, id) => (list || []).find(x => x.id === id);
const parseDay = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const fmtDay = s => { if (!s) return ''; const d = parseDay(s); return `${DAYS[d.getDay()]}, ${MONTHS[d.getMonth()]} ${d.getDate()}`; };
const daysUntil = s => { const t = new Date(); const today = new Date(t.getFullYear(), t.getMonth(), t.getDate()); return Math.round((parseDay(s) - today) / 86400000); };
const cls = w => (w && S.C[w.cat]) ? S.C[w.cat].class : null;
const limit = () => (S.g && S.g.meta.attachmentLimit) || 5;
const dump = w => (w && w.rpm && w.mag) ? w.mag / (w.rpm / 60) : null;
const f1 = n => (Math.round(n * 10) / 10).toFixed(1);
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };

/* ---------- loading ---------- */
async function getJSON(path, fallback) {
  try {
    const r = await fetch(path, { cache: 'no-cache' });
    if (!r.ok) throw new Error(r.status);
    return await r.json();
  } catch (e) { return fallback; }
}

async function boot() {
  const [g, news, patches, shop, meta, tiers, maps, atts, dmz, prog] = await Promise.all([
    getJSON('data/game.json', null), getJSON('data/news.json', []), getJSON('data/patches.json', []),
    getJSON('data/shop.json', { date: null, items: [] }), getJSON('data/meta.json', []),
    getJSON('data/tiers.json', null), getJSON('data/maps.json', null), getJSON('data/attachments.json', {}),
    getJSON('data/dmz.json', null), getJSON('data/progress.json', null)
  ]);
  S.tiers = tiers; S.maps = maps; S.A = atts || {}; S.dmz = dmz; S.prog = prog;
  if (!g) { viewEl.innerHTML = '<div class="empty"><h3>Couldn\'t load the armory</h3><p>Check your connection and refresh the page.</p></div>'; return; }
  S.g = g; S.news = news || []; S.patches = (patches || []).slice().sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  S.shop = shop || { date: null, items: [] }; S.meta = meta || [];
  g.categories.forEach(c => { S.C[c.id] = c; });
  g.weapons.forEach(w => { S.W[w.id] = w; });
  S.lvl = readLvl();
  S.camo = readCamo();
  S.camoMode = S.camo.mode === 'dmz' ? 'dmz' : 'mp';
  S.camoOpen = new Set(['ar', 'g-mil', 'g-comp', 'pt-w']);
  S.favs = readFavs();
  syncTheme();
  S.L = starter();
  const d = daysUntil(g.meta.launch);
  route(readHash());
}

/* ---------- routing ---------- */
function readHash() { try { return decodeURIComponent(location.hash.slice(1)); } catch (e) { return ''; } }
function go(h) {
  try { if (readHash() !== h) history.pushState(null, '', h ? '#' + h : location.pathname); } catch (e) {}
  route(h);
  window.scrollTo(0, 0);
}
window.addEventListener('popstate', () => route(readHash()));
const topBar = document.querySelector('.top');
const syncTop = () => { if (topBar) topBar.classList.toggle('compact', window.scrollY > 40); };
window.addEventListener('scroll', syncTop, { passive: true });

function route(h) {
  if (!S.g) return;
  h = h || 'home';
  if (h.startsWith('l-')) {
    const L = decode(h);
    if (L) { S.L = L; toast(`Loaded "${L.name}"`); } else toast('That share link is broken or incomplete.');
    h = 'build';
  }
  S.apexPeek = false;
  document.getElementById('sheet').hidden = true;
  if (h.startsWith('g-') && S.W[h.slice(2)]) { S.view = 'gun'; S.gun = h.slice(2); }
  else if (['home', 'guns', 'gear', 'ops', 'camos', 'build', 'shop', 'patches', 'vs', 'meta', 'maps', 'dmz', 'progress'].includes(h)) S.view = h;
  else S.view = 'home';
  render();
}

function render() {
  const tab = ['gun', 'vs', 'gear', 'ops'].includes(S.view) ? 'guns' : S.view;
  document.querySelectorAll('.tab').forEach(t => {
    if (t.dataset.tab === tab) t.setAttribute('aria-current', 'page'); else t.removeAttribute('aria-current');
  });
  const fn = { home: renderHome, guns: renderGuns, gun: renderGun, vs: renderVs, gear: renderGear, ops: renderOps, camos: renderCamos, build: renderBuild, shop: renderShop, patches: renderPatches, meta: renderMeta, maps: renderMaps, dmz: renderDMZ, progress: renderProgress }[S.view];
  viewEl.innerHTML = fn();
  afterRender();
}

function afterRender() {
  startTick();
  const road = document.getElementById('road');
  if (road) {
    const done = road.querySelectorAll('.road-card.done');
    const target = road.querySelector('.road-card.next') || done[done.length - 1];
    if (target) road.scrollLeft = Math.max(0, target.offsetLeft - road.offsetLeft - 8);
  }
}

/* ---------- player level ---------- */
function readLvl() { try { const v = parseInt(localStorage.getItem(LVLKEY), 10); return v >= 1 && v <= 55 ? v : null; } catch (e) { return null; } }
function setLvl(v) {
  v = Math.max(1, Math.min(55, Math.round(Number(v)) || 1));
  S.lvl = v;
  try { localStorage.setItem(LVLKEY, String(v)); } catch (e) {}
}
function lvlBadge(unlock) {
  if (!S.lvl) return `<span class="lvl">LVL ${unlock}</span>`;
  return unlock <= S.lvl ? `<span class="lvl got" title="Unlocked">LVL ${unlock} ✓</span>` : `<span class="lvl locked" title="${unlock - S.lvl} levels to go">LVL ${unlock}</span>`;
}
const KIND_PL = { Gun: ['gun', 'guns'], Melee: ['knife', 'knives'], Perk: ['perk', 'perks'], Lethal: ['lethal', 'lethals'], Tactical: ['tactical', 'tacticals'], 'Field upgrade': ['field upgrade', 'field upgrades'], Streak: ['streak', 'streaks'] };
function roadData() {
  if (S.road) return S.road;
  const g = S.g, m = {};
  const add = (list, kind) => list.forEach(x => { (m[x.unlock] = m[x.unlock] || []).push({ id: x.id, name: x.name, kind: typeof kind === 'function' ? kind(x) : kind }); });
  add(g.weapons, w => w.cat === 'melee' ? 'Melee' : 'Gun');
  add(g.perks, 'Perk'); add(g.lethals, 'Lethal'); add(g.tacticals, 'Tactical'); add(g.fieldUpgrades, 'Field upgrade'); add(g.killstreaks, 'Streak');
  S.road = Object.keys(m).map(Number).sort((a, b) => a - b).map(l => ({ lvl: l, items: m[l] }));
  return S.road;
}

function roadHTML() {
  const road = roadData(), L = S.lvl;
  const next = L ? road.find(r => r.lvl > L) : null;
  let line;
  if (!L) line = 'Set your Player Level and this shows exactly what you unlock next.';
  else if (!next) line = `Level ${L}. <b>Everything's unlocked.</b> Time to grind camos and Apex attachments.`;
  else {
    const away = next.lvl - L;
    const what = next.lvl === 4 ? 'Create-a-Class opens up' : next.items.map(i => i.name).join(', ');
    line = `<b>${esc(what)}</b> at Level ${next.lvl}. ${away === 1 ? 'One level away.' : `${away} levels away.`}`;
  }
  const cards = road.map(r => {
    const state = !L ? '' : r.lvl <= L ? ' done' : (next && r.lvl === next.lvl ? ' next' : '');
    let body;
    if (r.lvl === 4) {
      const counts = {};
      r.items.forEach(i => { counts[i.kind] = (counts[i.kind] || 0) + 1; });
      body = `<span class="ri">Create-a-Class</span><small>${Object.entries(counts).map(([k, n]) => plural(n, KIND_PL[k][0], KIND_PL[k][1])).join(', ')}</small>`;
    } else {
      body = r.items.map(i => `<span class="ri"><span class="rk">${esc(i.kind)}</span>${esc(i.name)}</span>`).join('');
    }
    const gun = r.lvl !== 4 && r.items.find(i => S.W[i.id]);
    return `<div class="road-card${state}"><span class="road-lvl">${r.lvl}</span>${gun ? `<span class="mini">${gunPic(S.W[gun.id])}</span>` : ''}${body}</div>`;
  }).join('');
  return `<section class="sec">
    <div><h2 class="h">Road to 55</h2><p class="sub">Every unlock from Level 4 to 55, and what's next for you.</p></div>
    <div class="card road-top">
      <div class="lvl-step"><label class="lbl" for="lvl-in">Your level</label>
        <div class="stepper"><button data-act="lvl-dn" aria-label="Level down">−</button><input id="lvl-in" type="number" inputmode="numeric" min="1" max="55" value="${L || ''}" placeholder="–" aria-label="Your Player Level"><button data-act="lvl-up" aria-label="Level up">+</button></div>
      </div>
      <p class="road-next">${line}</p>
    </div>
    <div class="road" id="road" role="list">${cards}</div>
  </section>`;
}

/* ---------- shared pieces ---------- */
function patchCard(p) {
  const ch = (p.changes || []).filter(c => S.W[c.weapon] || c.item);
  return `<article class="patch">
    <p class="eyebrow">${esc(fmtDay(p.date))}${p.season ? ' · ' + esc(p.season) : ''}</p>
    <h3>${esc(p.title)}</h3>
    ${p.summary ? `<p>${esc(p.summary)}</p>` : ''}
    ${ch.length ? `<ul class="changes">${ch.map(c => `<li><span class="tag ${esc(c.type)}">${esc(TYPE_LABEL[c.type] || 'Change')}</span><span>${S.W[c.weapon] ? `<button class="linkish" data-gun="${esc(c.weapon)}">${esc(S.W[c.weapon].name)}</button> ` : `<b>${esc(c.item)}</b> `}${esc(c.text)}</span></li>`).join('')}</ul>` : ''}
    ${(p.other || []).length ? `<ul class="small muted" style="margin:0;padding-left:1.1em">${p.other.map(o => `<li>${esc(o)}</li>`).join('')}</ul>` : ''}
    ${p.url ? `<a href="${esc(p.url)}" target="_blank" rel="noopener">Full patch notes</a>` : ''}
  </article>`;
}

function shopItem(it) {
  return `<article class="item">
    <div class="item-top"><span class="tag">${esc(it.type || 'Bundle')}</span>${it.price != null ? `<span class="price">${Number(it.price).toLocaleString()} ${esc(it.currency || 'CP')}</span>` : ''}</div>
    <h3>${esc(it.name)}</h3>
    ${(it.items || []).length ? `<ul>${it.items.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}
    ${it.note ? `<p class="small muted">${esc(it.note)}</p>` : ''}
  </article>`;
}

function shopEmpty() {
  const d = daysUntil(S.g.meta.launch);
  const msg = d > 0
    ? `The in-game store opens with the full launch on ${fmtDay(S.g.meta.launch)}. Kit Up checks it every morning, and each day's bundles, blueprints and prices show up here.`
    : `Today's bundles haven't been added yet. Kit Up checks the store every morning, so look again later today.`;
  return `<div class="empty"><h3>${d > 0 ? 'Store opens at launch' : 'Not in yet'}</h3><p>${msg}</p></div>`;
}

/* ---------- weapon art: parametric renders (generic shapes, drawn from each gun's traits) ---------- */
const ART = {
  'han-86':         { f: 'rifle', stock: 'solid', mag: 'curved', hg: 66, bl: 22, muz: 'brake', optic: 'dot' },

function topoSVG() {
  if (topoCache) return topoCache;
  let seed = 11;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const hills = [[330, 40, 9], [50, 230, 8], [215, 190, 4]];
  let d = '';
  hills.forEach(([cx, cy, n]) => {
    const ph = [rnd() * 6.28, rnd() * 6.28, rnd() * 6.28];
    for (let k = 1; k <= n; k++) {
      const R = k * 20;
      for (let i = 0; i <= 56; i++) {

        const r = R * (1 + 0.17 * Math.sin(3 * t + ph[0] + k * 0.18) + 0.08 * Math.sin(5 * t + ph[1]) + 0.05 * Math.sin(2 * t + ph[2] - k * 0.12));

function hashStr(s) { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
const topoMemo = {};
function mapTopo(name) {
  if (topoMemo[name]) return topoMemo[name];
  let seed = hashStr(name) % 2147483646 + 1;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  let d = '';
  for (let h = 0; h < 2; h++) {
    const cx = 20 + rnd() * 120, cy = 12 + rnd() * 60, n = 4 + Math.floor(rnd() * 4), p0 = rnd() * 6.28, p1 = rnd() * 6.28;
    for (let k = 1; k <= n; k++) {
      const R = k * 9;
      for (let i = 0; i <= 36; i++) {
        const a = i / 36 * Math.PI * 2;
        const r = R * (1 + 0.18 * Math.sin(3 * a + p0 + k * 0.2) + 0.08 * Math.sin(5 * a + p1));
        d += (i ? 'L' : 'M') + (cx + Math.cos(a) * r * 1.35).toFixed(1) + ' ' + (cy + Math.sin(a) * r * 0.8).toFixed(1);
      }
      d += 'Z';
    }
  }
  return (topoMemo[name] = `<svg viewBox="0 0 160 100" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><path d="${d}"/></svg>`);
}
const isSoon = x => x.from && daysUntil(x.from) > 0;
const shortDay = s => fmtDay(s).split(', ')[1];
function mapTile(m, pl) {
  const soon = isSoon(m);
  return `<div class="map${soon ? ' soon' : ''}">${mapTopo(m.n)}${soon ? `<span class="pill when">${esc(shortDay(m.from))}</span>` : ''}<b>${esc(m.n)}</b><small>${esc(pl.size)}</small></div>`;
}
function mapsStripHTML() {

  return `<section class="sec">
    <div class="sec-head"><h2 class="h">Maps</h2><button class="more" data-go="maps">Maps & modes ›</button></div>
    <div class="carousel">${core.maps.slice().sort((a, b) => isSoon(b) - isSoon(a)).map(m => mapTile(m, core)).join('')}</div>
  </section>`;

function renderMaps() {
  const M = S.maps;
  if (!M) return `<div class="empty"><h3>Maps didn't load</h3><p>Check your connection and refresh the page.</p></div>`;
  const all = M.playlists.flatMap(p => p.maps);

  const modes = M.modes.map(m => `<span class="mode${isSoon(m) ? ' soon' : ''}">${esc(m.n)}${m.tag ? `<span class="pill">${esc(m.tag)}</span>` : ''}${isSoon(m) ? `<span class="pill ghost">${esc(shortDay(m.from))}</span>` : m.note ? `<span class="pill ghost">${esc(m.note)}</span>` : ''}</span>`).join('');
  return `<div class="stack">

function gunRow(w, maxRpm, flat) {
  const c = S.C[w.cat];

}

function gunList() {
  const q = S.q.trim().toLowerCase();
  let list = S.g.weapons.filter(w => (S.cat === 'all' || (S.cat === 'saved' ? S.favs.has(w.id) : w.cat === S.cat)) && (!q || w.name.toLowerCase().includes(q) || S.C[w.cat].name.toLowerCase().includes(q)));
  const sorter = {
    unlock: (a, b) => a.unlock - b.unlock || a.name.localeCompare(b.name),
    rpm: (a, b) => (b.rpm || 0) - (a.rpm || 0),
    meta: (a, b) => (b.pick == null ? -1 : b.pick) - (a.pick == null ? -1 : a.pick) || a.name.localeCompare(b.name),
    ttk: (a, b) => (liveOf(a, 'ttk15') == null ? 1e9 : a.live.ttk15) - (liveOf(b, 'ttk15') == null ? 1e9 : b.live.ttk15) || a.name.localeCompare(b.name),
    ads: (a, b) => (liveOf(a, 'ads') == null ? 1e9 : a.live.ads) - (liveOf(b, 'ads') == null ? 1e9 : b.live.ads) || a.name.localeCompare(b.name),
    dump: (a, b) => (dump(b) || 0) - (dump(a) || 0),
    name: (a, b) => a.name.localeCompare(b.name)
  }[S.sort];
  list = list.slice().sort(sorter);
  if (!list.length) return S.cat === 'saved' && !q ? `<div class="empty"><h3>Nothing saved yet</h3><p>Tap the bookmark on any gun to keep it here and on your home screen.</p></div>` : `<div class="empty"><h3>No match</h3><p>Nothing called "${esc(S.q)}" in this class. Try a shorter search.</p></div>`;
  const maxBy = {};
  S.g.weapons.forEach(w => { maxBy[w.cat] = Math.max(maxBy[w.cat] || 0, w.rpm || 0); });
  if (S.cat === 'all' && !q && S.sort === 'unlock') {
    return S.g.categories.map(c => {
      const items = list.filter(w => w.cat === c.id);
      return items.length ? `<div class="group"><h3>${esc(c.name)} · ${items.length}</h3><div class="wlist">${items.map(w => gunRow(w, maxBy[w.cat])).join('')}</div></div>` : '';
    }).join('');
  }
  return `<div class="wlist">${list.map(w => gunRow(w, maxBy[w.cat], true)).join('')}</div>`;
}

function feelLine(w) {
  return dump(w) ? `<div class="feel"><span class="lbl">How it feels</span><p>${feelText(w)}</p></div>` : '';
}
function feelText(w) {
  const dm = dump(w);
  if (!dm) return '';
  const rps = w.rpm / 60;
  const peers = S.g.weapons.filter(x => x.cat === w.cat && x.rpm);
  const rank = peers.slice().sort((a, b) => b.rpm - a.rpm).findIndex(x => x.id === w.id) + 1;
  const pos = peers.length > 1 ? (rank === 1 ? `the fastest-firing ${S.C[w.cat].one.toLowerCase()}` : rank === peers.length ? `the slowest-firing ${S.C[w.cat].one.toLowerCase()}` : `#${rank} of ${peers.length} ${S.C[w.cat].name.toLowerCase()} on fire rate`) : '';
  const shots = w.rpm >= 200 ? `<b>${f1(rps)}</b> rounds a second` : `a shot every <b>${f1(60 / w.rpm)}s</b>`;
  const spray = w.mag > 3 ? ` Holding the trigger empties the mag in <b>${f1(dm)}s</b>.` : '';
  return `Puts out ${shots}${pos ? `, ${pos}` : ''}.${spray} You carry <b>${w.mag + w.reserve}</b> rounds total.`;
}

function statBars(w) {

  const max = (list, f) => Math.max(...list.map(f));
  const rows = [

  ];
  if (w.mag > 3) rows.push(['Spray time', dump(w), max(pool.filter(x => x.mag > 3), dump), `${f1(dump(w))}s`]);

    <p class="small muted">${w.cat === 'launcher' ? 'Bars compare against the other launchers.' : `Fire rate and spray time compare against every gun. Magazine and ammo compare against other ${esc(S.C[w.cat].name.toLowerCase())}.`}</p>

}

/* ---------- live stats ---------- */
const TTK_R = [['ttk15', '0–15 m'], ['ttk40', '15–40 m'], ['ttk80', '40–80 m'], ['ttk100', '80–100 m']];
const fmtMs = v => v === 0 ? '1 shot' : `${Math.round(v)} ms`;
const fmtS = v => `${(v / 1000).toFixed(2)}s`;
const pickTxt = p => p < 0.1 ? '<0.1%' : `${p}%`;
const liveOf = (w, k) => (w && w.live && w.live[k] != null) ? w.live[k] : null;
const lv = k => w => liveOf(w, k);
function rankBy(w, get, low) {
  const v = get(w);
  if (v == null) return null;
  const peers = S.g.weapons.filter(x => x.cat === w.cat && get(x) != null);
  return { rank: peers.filter(x => low ? get(x) < v : get(x) > v).length + 1, of: peers.length };
}
const rankTxt = r => !r || r.of < 2 ? '' : r.rank === 1 ? `Best of ${r.of}` : `#${r.rank} of ${r.of}`;
const isTop = r => !!(r && r.rank === 1 && r.of > 1);
const LIVE_TABS = [
  ['hand', 'Handling', [['ADS speed', lv('ads'), v => v + ' ms', 1], ['Sprint to fire', lv('stf'), v => v + ' ms', 1], ['Reload', lv('reload'), fmtS, 1], ['Raise speed', lv('raise'), v => v + ' ms', 1]]],
  ['ball', 'Ballistics', [['Bullet velocity', lv('vel'), v => v + ' m/s', 0], ['Hitscan range', lv('hitscan'), v => v + ' m', 0], ['Penetration', lv('pen'), v => v + ' in', 0], ['Fire rate', lv('rpm'), v => v + ' RPM', 0]]],
  ['move', 'Movement', [['Walk speed', lv('move'), v => v + ' m/s', 0], ['Tac sprint', lv('tac'), v => v + ' m/s', 0], ['Sprint', lv('sprint'), v => v + ' m/s', 0], ['Aim walk', lv('adsMove'), v => v + ' m/s', 0]]],
  ['rec', 'Recoil', [['Vertical', lv('vRecoil'), v => v, 1], ['Horizontal', lv('hRecoil'), v => v, 1], ['Gun kick', lv('kick'), v => v, 1], ['Aim sway', lv('sway'), v => v + '°', 1]]],
  ['ammo', 'Ammo', [['Magazine', w => w.mag || null, v => v, 0], ['Total ammo', w => w.mag ? w.mag + (w.reserve || 0) : null, v => v, 0], ['Full spray', w => (w.mag > 3 ? dump(w) : null), v => f1(v) + 's', 0], ['Weapon levels', w => w.levels || null, v => v, 1]]]
];
const NO_TTK = { sg: 'Shotgun kills come down to how many pellets land, so there\'s no single TTK.', sr: 'Snipers live on one-shot zones, so there\'s no single TTK.', launcher: 'Launchers are for streaks and vehicles, so there\'s no TTK.' };
function tierOf(id) {
  if (!S.tierMap) { S.tierMap = {}; metaTiers().forEach(t => t.ids.forEach(i => { S.tierMap[i] = t.t; })); }
  return S.tierMap[id] || null;
}
const tierMark = (id, big) => { const t = tierOf(id); return t && t !== '2nd' ? `<span class="tmark t-${t.toLowerCase()}${big ? ' big' : ''}" title="${t} tier in the live meta">${big ? t + ' tier' : t}</span>` : ''; };
function statusPill(w) {
  if (!w.metaStatus) return '';
  return `<span class="mstat${w.metaStatus === 'Absolute Meta' ? ' hot' : ''}"><b>${esc(w.metaStatus)}</b>${w.pick != null ? `<small>${pickTxt(w.pick)} pick rate</small>` : ''}</span>`;
}
function liveCard(w) {
  if (!w.live || w.live.ads == null) return statBars(w);
  const c = S.C[w.cat], peers = S.g.weapons.filter(x => x.cat === w.cat && liveOf(x, 'ads') != null);
  const ttk = TTK_R.filter(([k]) => liveOf(w, k) != null);
  const ttkRows = ttk.map(([k, lab]) => {

  }).join('');
  const tabs = LIVE_TABS.filter(t => t[2].some(m => m[1](w) != null));

const CAMOKEY = 'lhq.camos.v1';
function readCamo() { try { const o = JSON.parse(localStorage.getItem(CAMOKEY) || '{}'); return o && typeof o === 'object' ? o : {}; } catch (e) { return {}; } }

/* progress code: c1.<id>~<base36 bits>,...;<mp bits><dmz bits><mode> */
const packW = r => r.m | r.s.reduce((a, v, i) => a | (v << (4 + i)), 0) | (r.g << 7) | (r.p << 8) | (r.h << 9) | r.py.reduce((a, v, i) => a | (v << (10 + i)), 0);

  return 'c1.' + ws.join(',') + ';' + bits(S.camo.mp) + bits(S.camo.dmz) + (S.camoMode === 'dmz' ? 'd' : 'm');
}
function readCamoCode(code) {

  if (!m) throw new Error('bad');

  (m[1] ? m[1].split(',') : []).forEach(pair => {
    const [id, v] = pair.split('~'), n = parseInt(v, 36);
    if (!S.W[id] || !(n >= 0)) return;
    w[id] = { m: Math.min(8, n & 15), s: [0, 1, 2].map(i => !!(n >> (4 + i) & 1)), g: !!(n >> 7 & 1), p: !!(n >> 8 & 1), h: !!(n >> 9 & 1), py: [0, 1, 2, 3].map(i => !!(n >> (10 + i) & 1)) };
  });

}
function cw(id) {

  r.s = [0, 1, 2].map(i => !!(r.s && r.s[i]));

}

  const mil = C.military.imgs.map((img, i) => `<button class="mil${r.m >= i + 1 ? ' on' : ''}" data-cm="${w.id}" data-i="${i + 1}" aria-pressed="${r.m >= i + 1}"><img src="${esc(img)}" alt="" loading="lazy" decoding="async"><span>${i + 1}${lv ? ` · Lv ${lv[i]}` : ''}</span></button>`).join('');
  const spec = [0, 1, 2].map(i => {
    const d = sp && sp[i];
    return `<button class="spc${r.s[i] ? ' on' : ''}" data-cs="${w.id}" data-i="${i}" aria-pressed="${r.s[i]}">
      ${d && d.img ? `<img src="${esc(d.img)}" alt="" loading="lazy" decoding="async">` : `<span class="spc-ph"><span class="ph-d">◆</span>${d ? `<small>${esc(d.name)}</small>` : ''}</span>`}
      <span class="spc-t"><b>${d ? esc(d.name) : `Special ${i + 1}`}</b><small>${d ? `${d.level ? `Lv ${d.level} · ` : ''}${esc(d[mode] || d.mp)}` : 'Challenge shown in game'}</small></span><span class="chk">${r.s[i] ? '✓' : ''}</span></button>`;
  }).join('');
  const comp = [
    ['g', 'Gold', C.gold.img, r.g, true, (gunReq(w, 'gold') || C.gold[mode].replace(/^./, c => c.toUpperCase())) + '.' + (goldOpen(w) || r.g ? '' : ' Marking it fills in Military and Special.'), ''],
    ['p', 'Platinum', C.platinum.img, r.p, platOpen(w), classReq(w, 'platinum'), `Get Gold on all ${S.g.weapons.filter(x => x.cat === w.cat).length} ${S.C[w.cat].name.toLowerCase()} first.`],
    ['h', 'Harmonic Break', C.harmonic.img, r.h, hbOpen(), classReq(w, 'harmonic'), `Get Platinum on all ${S.g.weapons.length} weapons first.`]
  ].map(([k, name, img, on, open, req, lock]) => `<div class="ccomp${on ? ' on' : ''}${!open && !on ? ' locked' : ''}"><img src="${esc(img)}" alt="" loading="lazy" decoding="async"><div><b>${name}</b><small>${esc(open || on ? req : lock)}</small></div>${tierBtn(w, k, on, open, on ? 'Done' : open ? 'Mark' : 'Locked')}</div>`).join('');
  const pyro = C.prestige.map((p, i) => `<button class="spc wide${r.py[i] ? ' on' : ''}" data-cpy="${w.id}" data-i="${i}" aria-pressed="${r.py[i]}"><img src="${esc(p.img)}" alt="" loading="lazy" decoding="async"><span class="spc-t"><b>${esc(p.name)}</b><small>${esc(p.req)}</small></span><span class="chk">${r.py[i] ? '✓' : ''}</span></button>`).join('');
  const nComp = [r.g, r.p, r.h].filter(Boolean).length;
  return `<section class="sec cpanel" id="camo-panel">
    <div class="sec-head"><h3 class="h3">Camo grind</h3>${camoModeToggle()}</div>

      ${dd('g-mil', 'Military', `${r.m}/8`, `${lv ? '' : '<p class="small muted">Unlock levels vary by gun and show in game.</p>'}<div class="milgrid">${mil}</div>`, `<span class="hsw" aria-hidden="true">${[1, 2, 3, 4, 5, 6, 7, 8].map(i => `<i class="sw${r.m >= i ? ' on' : ''}" style="--sw:url(${milSw(i)})"></i>`).join('')}</span>`)}
      ${dd('g-sp', 'Special', `${r.s.filter(Boolean).length}/3`, `<div class="spcs">${spec}</div>`, `<span class="hsw dia" aria-hidden="true">${[0, 1, 2].map(i => { const u = spSw(w, i); return `<i class="${u ? 'sw' : 'gen'}${r.s[i] ? ' on' : ''}"${u ? ` style="--sw:url(${u})"` : ''}></i>`; }).join('')}</span>`)}
      ${dd('g-comp', 'Gold · Plat · Harmonic', `${nComp}/3`, `<div class="ccomps">${comp}</div>`, `<span class="cdots" aria-hidden="true">${[['g', 'gd'], ['p', 'pt'], ['h', 'hb']].map(([k, c]) => `<i class="${r[k] ? c : ''}"></i>`).join('')}</span>`)}

/* ---------- head to head ---------- */
function renderVs() {
  const [a, b] = S.vs.map(id => S.W[id]);
  const list = S.g.weapons.filter(w => w.cat !== 'melee');
  const metrics = [
    ['Live stats'],
    ['TTK 0–15 m', lv('ttk15'), fmtMs, 'low'],
    ['TTK 15–40 m', lv('ttk40'), fmtMs, 'low'],
    ['TTK 40–80 m', lv('ttk80'), fmtMs, 'low'],
    ['ADS speed', lv('ads'), v => v + ' ms', 'low'],
    ['Sprint to fire', lv('stf'), v => v + ' ms', 'low'],
    ['Reload', lv('reload'), fmtS, 'low'],
    ['Bullet velocity', lv('vel'), v => v + ' m/s', 'high'],
    ['Walk speed', lv('move'), v => v + ' m/s', 'high'],
    ['Vertical recoil', lv('vRecoil'), v => v, 'low'],
    ['Pick rate', w => w.pick, v => pickTxt(v), 'high'],
    ['Ammo & unlocks'],
    ['Fire rate', w => w.rpm, v => v, 'high'],
    ['Magazine', w => w.mag, v => v, 'high'],
    ['Total ammo', w => w.mag + w.reserve, v => v, 'high'],
    ['Full spray', w => dump(w), v => f1(v) + 's', 'high'],
    ['Levels to Apex', w => w.apex ? w.levels : null, v => v, 'low'],
    ['Unlock level', w => w.unlock, v => v, 'low']
  ];
  const rows = metrics.map(([label, get, fmt, better]) => {
    if (!get) return `<p class="vs-sh lbl">${label}</p>`;
    const va = get(a), vb = get(b);
    if (va == null && vb == null) return '';
    const vals = [va, vb].filter(v => v != null);
    const hi = Math.max(...vals) || 1, lo = Math.min(...vals);
    const width = v => v == null ? 0 : better === 'high' ? v / hi : v === lo ? 1 : lo === 0 ? .3 : lo / v;
    const win = (va == null || vb == null || va === vb) ? null : ((better === 'high') === (va > vb) ? 'a' : 'b');
    const side = (v, k) => `<div class="vs-side ${k === 'a' ? 'l' : 'r'}${win === k ? ' win' : ''}"><span class="v">${v == null ? '—' : fmt(v)}</span><span class="bar"><i style="width:${v == null ? 0 : Math.max(4, Math.round(width(v) * 100))}%"></i></span></div>`;
    return `<div class="vs-row">${side(va, 'a')}<div class="vs-m">${label}</div>${side(vb, 'b')}</div>`;
  }).join('');
  const shared = a.slots.filter(s => b.slots.includes(s));
  const onlyA = a.slots.filter(s => !b.slots.includes(s)), onlyB = b.slots.filter(s => !a.slots.includes(s));
  const take = [];
  if (a.id === b.id) take.push('Same gun on both sides. Pick something else to compare.');
  else {
    [['ttk15', 'up close'], ['ttk40', 'at 15–40 m']].forEach(([k, where]) => {
      const x = liveOf(a, k), y = liveOf(b, k);
      if (x == null || y == null || x === y) return;
      const [f, s] = x < y ? [a, b] : [b, a];
      take.push(f.live[k] === 0 ? `${f.name} one-shots ${where}. ${s.name} needs ${s.live[k]} ms.` : `${f.name} kills ${s.live[k] - f.live[k]} ms faster ${where}.`);
    });
    const ax = liveOf(a, 'ads'), bx = liveOf(b, 'ads');
    if (ax != null && bx != null && Math.abs(ax - bx) >= 10) { const [f, s] = ax < bx ? [a, b] : [b, a]; take.push(`${f.name} aims in ${s.live.ads - f.live.ads} ms quicker.`); }
    if (a.rpm && b.rpm && a.rpm !== b.rpm) { const [f, s] = a.rpm > b.rpm ? [a, b] : [b, a]; take.push(`${f.name} fires ${f.rpm - s.rpm} more rounds a minute${f.rpm / s.rpm > 1.5 ? ', and that is a huge gap' : ''}.`); }
    if (a.mag && b.mag && a.mag !== b.mag) { const [f, s] = a.mag > b.mag ? [a, b] : [b, a]; take.push(`${f.name} holds ${f.mag - s.mag} more in the mag, so you reload less.`); }
    const da = dump(a), db = dump(b);
    if (da && db && Math.abs(da - db) >= .3) { const [f, s] = da > db ? [a, b] : [b, a]; take.push(`${f.name} can keep firing ${f1(Math.abs(da - db))}s longer before it runs dry.`); }
    if (a.unlock !== b.unlock) { const [e, l] = a.unlock < b.unlock ? [a, b] : [b, a]; take.push(`${e.name} unlocks ${l.unlock - e.unlock} levels earlier.`); }
    if (a.apex && b.apex && a.levels !== b.levels) { const [q, s] = a.levels < b.levels ? [a, b] : [b, a]; take.push(`${q.name} reaches its Apex ${s.levels - q.levels} weapon levels sooner.`); }
  }
  return `<section class="sec">
    <div class="gun-bar"><button class="back-b" data-go="guns" aria-label="Back to Arsenal"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5 8 12l7 7"/></svg>Arsenal</button></div>
    <h2 class="h">Head to head</h2>
    <div class="vs-pick">
      <select id="vs-0" data-vs="0" aria-label="First weapon">${weaponOptions(list, a.id)}</select>
      <span class="vs-word">VS</span>
      <select id="vs-1" data-vs="1" aria-label="Second weapon">${weaponOptions(list, b.id)}</select>
    </div>
    <div class="vs-plates"><span class="plate">${gunPic(a)}</span><span class="plate">${gunPic(b)}</span><span class="vs-badge" aria-hidden="true">VS</span></div>
    <div class="vs-names"><h3>${esc(a.name)}${tierMark(a.id)}</h3><h3>${esc(b.name)}${tierMark(b.id)}</h3></div>
    <div class="vs-rows">${rows}</div>
    <div class="take"><span class="lbl">The quick take</span><ul>${take.slice(0, 5).map(t => `<li>${esc(t)}</li>`).join('')}</ul></div>
    <div class="card">
      <span class="lbl">Gunsmith slots</span>
      <p class="small"><b>Both:</b> <span class="muted">${shared.length ? esc(shared.join(', ')) : 'None'}</span></p>
      ${onlyA.length ? `<p class="small"><b>Only ${esc(a.name)}:</b> <span class="muted">${esc(onlyA.join(', '))}</span></p>` : ''}
      ${onlyB.length ? `<p class="small"><b>Only ${esc(b.name)}:</b> <span class="muted">${esc(onlyB.join(', '))}</span></p>` : ''}
    </div>
    ${a.apex || b.apex ? `<div class="card"><span class="lbl">Apex</span>
      ${a.apex ? `<p class="small"><b>${esc(a.apex.name)}:</b> <span class="muted">${esc(a.apex.about)}</span></p>` : ''}
      ${b.apex ? `<p class="small"><b>${esc(b.apex.name)}:</b> <span class="muted">${esc(b.apex.about)}</span></p>` : ''}
    </div>` : ''}
  </section>`;
}

/* ---------- loadout ---------- */
function starter() {
  return {
    name: 'Level 4 Starter', op: 'Min-Hee',
    p: { w: 'han-86', att: [], apex: false },
    s: { w: 'sang-9mm', att: [], apex: false },
    lethal: 'frag', tactical: 'flash', fu: 'portable-radar',
    perks: ['quick-fix', 'blood-rush', 'combat-grid'],
    ks: ['uav', 'artillery-beacon', 'attack-helicopter']
  };
}

function sanitize(L) {
  const g = S.g, d = starter();
  if (!g.operators.some(o => o.name === L.op)) L.op = d.op;
  L.perks = [1, 2, 3].map((n, i) => { const p = byId(g.perks, L.perks && L.perks[i]); return p && p.slot === n ? p.id : d.perks[i]; });
  const overkill = L.perks.includes('overkill');
  if (cls(S.W[L.p && L.p.w]) !== 'primary') L.p = { w: d.p.w, att: [], apex: false };
  const sc = cls(S.W[L.s && L.s.w]);
  if (!(sc === 'secondary' || (overkill && sc === 'primary'))) L.s = { w: d.s.w, att: [], apex: false };
  ['p', 's'].forEach(k => {
    const w = S.W[L[k].w];
    L[k].apex = !!(L[k].apex && w.apex);
    const blocked = L[k].apex ? w.apex.blocks : [];
    const seen = new Set();
    L[k].att = (L[k].att || []).filter(a => a && w.slots.includes(a.s) && !blocked.includes(a.s) && !seen.has(a.s) && seen.add(a.s))
      .slice(0, limit()).map(a => ({ s: a.s, n: String(a.n || '').slice(0, 40) }));
  });
  if (!byId(g.lethals, L.lethal)) L.lethal = d.lethal;
  if (!byId(g.tacticals, L.tactical)) L.tactical = d.tactical;
  if (!byId(g.fieldUpgrades, L.fu)) L.fu = d.fu;
  const ks = [];
  (L.ks || []).forEach(id => { if (byId(g.killstreaks, id) && !ks.includes(id)) ks.push(id); });
  d.ks.concat(g.killstreaks.map(k => k.id)).forEach(id => { if (ks.length < 3 && !ks.includes(id)) ks.push(id); });
  L.ks = ks.slice(0, 3);
  L.name = String(L.name || 'My loadout').slice(0, 40);
  return L;
}

function encode(L) {
  const o = { v: 1, n: L.name, o: L.op,
    p: [L.p.w, L.p.apex ? 1 : 0, L.p.att.map(a => [a.s, a.n])],
    s: [L.s.w, L.s.apex ? 1 : 0, L.s.att.map(a => [a.s, a.n])],
    e: [L.lethal, L.tactical, L.fu], k: L.perks, z: L.ks };
  const b = btoa(unescape(encodeURIComponent(JSON.stringify(o))));
  return 'l-' + b.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

function decode(code) {
  try {
    let b = String(code).trim();
    const at = b.lastIndexOf('#'); if (at >= 0) b = b.slice(at + 1);
    if (b.startsWith('l-')) b = b.slice(2);
    b = b.replace(/-/g, '+').replace(/_/g, '/');
    while (b.length % 4) b += '=';
    const o = JSON.parse(decodeURIComponent(escape(atob(b))));
    const slot = a => ({ w: a && a[0], apex: !!(a && a[1]), att: ((a && a[2]) || []).filter(Array.isArray).map(x => ({ s: x[0], n: x[1] })) });
    return sanitize({ name: o.n, op: o.o, p: slot(o.p), s: slot(o.s), lethal: o.e && o.e[0], tactical: o.e && o.e[1], fu: o.e && o.e[2], perks: o.k, ks: o.z });
  } catch (e) { return null; }
}

function reqLevel(L) {
  const g = S.g;
  const items = [S.W[L.p.w], S.W[L.s.w], byId(g.lethals, L.lethal), byId(g.tacticals, L.tactical), byId(g.fieldUpgrades, L.fu)]
    .concat(L.perks.map(id => byId(g.perks, id)), L.ks.map(id => byId(g.killstreaks, id)));
  let lvl = 4, from = 'Create-a-Class';
  items.forEach(x => { if (x && x.unlock > lvl) { lvl = x.unlock; from = x.name; } });
  return { lvl, from };
}

function rollClass() {
  const g = S.g, cap = S.lvl && S.lvl >= 4 ? S.lvl : 55, ok = x => x.unlock <= cap;
  const perks = [1, 2, 3].map(n => pick(g.perks.filter(p => p.slot === n && ok(p))).id);
  const over = perks.includes('overkill');
  const mk = w => {
    const apex = !!w.apex && Math.random() < .3;
    const blocked = apex ? w.apex.blocks : [];
    const free = shuffle(w.slots.filter(s => !blocked.includes(s)));
    const n = w.slots.length ? Math.min(free.length, limit(), 2 + Math.floor(Math.random() * 4)) : 0;
    return { w: w.id, apex, att: free.slice(0, n).map(s => ({ s, n: '' })) };
  };
  const p = pick(g.weapons.filter(w => cls(w) === 'primary' && ok(w)));
  const s = pick(g.weapons.filter(w => (cls(w) === 'secondary' || (over && cls(w) === 'primary')) && ok(w) && w.id !== p.id));
  const L = sanitize({
    name: '', op: pick(g.operators).name, p: mk(p), s: mk(s),
    lethal: pick(g.lethals.filter(ok)).id, tactical: pick(g.tacticals.filter(ok)).id, fu: pick(g.fieldUpgrades.filter(ok)).id,
    perks, ks: shuffle(g.killstreaks.filter(ok)).slice(0, 3).map(k => k.id)
  });
  L.name = 'Rolled ' + archetype(score(L)).name;
  return L;
}

function lockTag(x) { return S.lvl && x.unlock > S.lvl ? ', locked' : ''; }
function weaponOptions(choices, sel) {
  return S.g.categories.map(c => {
    const ws = choices.filter(w => w.cat === c.id);
    return ws.length ? `<optgroup label="${esc(c.name)}">${ws.map(w => `<option value="${w.id}"${w.id === sel ? ' selected' : ''}>${esc(w.name)} (Lvl ${w.unlock}${lockTag(w)})</option>`).join('')}</optgroup>` : '';
  }).join('');
}
function itemOptions(list, sel, extra) {
  return list.map(x => `<option value="${x.id}"${x.id === sel ? ' selected' : ''}>${esc(x.name)}${extra ? extra(x) : ` (Lvl ${x.unlock}${lockTag(x)})`}</option>`).join('');
}

function weaponBlock(k, label, choices) {
  const slot = S.L[k], w = S.W[slot.w], c = S.C[w.cat];
  const blocked = slot.apex ? w.apex.blocks : [];
  let atts = '';
  if (w.slots.length) {
    const used = slot.att.map(a => a.s);
    const avail = w.slots.filter(s => !blocked.includes(s));
    const AT = attsFor(w.id);
    const rows = slot.att.map((a, i) => {
      const opts = avail.filter(s => s === a.s || !used.includes(s)).map(s => `<option${s === a.s ? ' selected' : ''}>${esc(s)}</option>`).join('');
      const list = AT.filter(x => x.s === a.s), pick = list.find(x => x.n === a.n);
      const name = list.length
        ? `<select id="b-${k}-n${i}" data-att-pick="${k}:${i}" aria-label="${esc(a.s)} attachment">${a.n && !pick ? `<option value="${esc(a.n)}" selected>${esc(a.n)}</option>` : `<option value=""${a.n ? '' : ' selected'}>Pick a ${esc(a.s.toLowerCase())}</option>`}${list.map(x => `<option value="${esc(x.n)}"${x === pick ? ' selected' : ''}>${esc(x.n)} · Lv ${x.l == null ? '–' : x.l}</option>`).join('')}</select>`
        : `<input id="b-${k}-n${i}" data-att-name="${k}:${i}" value="${esc(a.n)}" maxlength="40" placeholder="${esc(a.s)} name" aria-label="${esc(a.s)} attachment name" autocomplete="off">`;
      return `<div class="att-w"><div class="att">
        <select id="b-${k}-s${i}" data-att-slot="${k}:${i}" aria-label="Attachment slot ${i + 1}">${opts}</select>
        ${name}
        <button class="x" data-att-del="${k}:${i}" aria-label="Remove ${esc(a.s)}">×</button>
      </div>${fxHTML(pick)}</div>`;
    }).join('');
    const canAdd = slot.att.length < limit() && avail.some(s => !used.includes(s));
    atts = `<span class="plate">${gunPic(w)}</span>
    <div class="atts">
      <div class="atts-head"><span class="lbl">Attachments</span><span class="mono small muted">${slot.att.length}/${limit()}</span></div>
      ${rows || `<p class="small muted">No attachments yet.</p>`}
      ${canAdd ? `<button class="add" data-att-add="${k}">+ Add attachment</button>` : ''}
    </div>`;
  } else {
    atts = `<p class="small muted">Launchers take no attachments.</p>`;
  }
  const apex = w.apex ? `<label class="apex-toggle${slot.apex ? ' on' : ''}" for="b-${k}-apex">
      <input type="checkbox" id="b-${k}-apex" data-apex="${k}"${slot.apex ? ' checked' : ''}>
      <span><b>Apex: ${esc(w.apex.name)}</b><small>Needs weapon level ${w.levels}. ${w.apex.blocks.length ? 'Blocks ' + esc(w.apex.blocks.join(', ')) + '.' : 'Blocks nothing.'}</small></span>
    </label>` : '';
  return `<div class="card">
    <div class="slot-top"><span class="lbl">${esc(label)}</span><button class="linkish small" data-gun="${w.id}">Gun page</button></div>
    <select id="b-${k}-w" data-pick="${k}" aria-label="${esc(label)} weapon">${weaponOptions(choices, slot.w)}</select>
    <p class="mini">${esc(c.one)}${w.rpm ? ` · ${w.rpm} RPM · ${w.mag}/${w.reserve}` : ''}</p>
    ${atts}
    ${apex}
  </div>`;
}

function weaponSummary(slot) {
  const w = S.W[slot.w];
  const parts = slot.att.map(a => a.n ? a.n : a.s);
  return `<b>${esc(w.name)}${slot.apex ? ' · Apex' : ''}</b><small>${parts.length ? esc(parts.join(' · ')) : (w.slots.length ? 'No attachments' : esc(S.C[w.cat].one))}</small>`;
}

function ladderHTML(L) {
  const hard = L.perks.includes('hardline'), max = 12;
  const ks = L.ks.map(id => byId(S.g.killstreaks, id)).map(k => ({ name: k.name, c: k.kills - (hard ? 1 : 0) })).sort((a, b) => a.c - b.c);
  const groups = [];
  ks.forEach(k => { const gp = groups.find(x => x.c === k.c); if (gp) gp.names.push(k.name); else groups.push({ c: k.c, names: [k.name] }); });
  let ticks = '';
  for (let i = 0; i <= max; i++) ticks += `<span class="lad-tick" style="left:${(i / max * 100).toFixed(2)}%"></span>`;
  const marks = groups.map((gp, i) => {
    const pos = gp.c / max;
    const al = pos < .2 ? ' al' : pos > .8 ? ' ar' : '';
    return `<div class="lad-m ${i % 2 ? 'up' : 'down'}${al}" style="left:${(pos * 100).toFixed(2)}%"><span class="lad-dot">${gp.c}</span><span class="lad-lbl">${esc(gp.names.join(' + '))}</span></div>`;
  }).join('');
  return `<div class="ladder" role="img" aria-label="Killstreak ladder: ${esc(groups.map(gp => `${gp.names.join(' and ')} at ${gp.c} kills`).join(', '))}"><div class="lad-track"></div>${ticks}<span class="lad-end" style="left:0">0</span><span class="lad-end" style="right:0">12 kills</span>${marks}</div>`;
}

function patchAlerts(L, since) {
  const out = [];
  S.patches.forEach(p => {
    if (since && p.date && parseDay(p.date).getTime() < since - 86400000) return;
    (p.changes || []).forEach(c => { if (c.weapon && (c.weapon === L.p.w || c.weapon === L.s.w)) out.push({ p, c }); });
  });
  return out;
}

function renderBuild() {

/* ---------- loadout card image ---------- */
function wrapText(ctx, text, maxW) {
  const words = String(text).split(' '), lines = [];
  let cur = '';
  words.forEach(w => { const t = cur ? cur + ' ' + w : w; if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; });
  if (cur) lines.push(cur);
  return lines;
}
function loadImg(src) {
  return new Promise(res => {
    const i = new Image(), t = setTimeout(() => res(null), 4000);
    i.onload = () => { clearTimeout(t); res(i); };
    i.onerror = () => { clearTimeout(t); res(null); };
    i.src = src;
  });
}
async function makeCard() {
  const L = S.L, g = S.g, sc = score(L), arch = archetype(sc), req = reqLevel(L);
  try { await Promise.race([Promise.all(['800 120px "Big Shoulders Display"', '600 40px "Barlow"', '500 30px "IBM Plex Mono"'].map(f => document.fonts.load(f))), new Promise(r => setTimeout(r, 1500))]); } catch (e) {}
  const W = 1080, H = 1350, cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const x = cv.getContext('2d');
  const C = { bg: '#0F1316', surf: '#171D21', line: '#2A3339', ink: '#E7EAE5', muted: '#8C979B', accent: '#9B7BFF', dark: '#120A2E', plate: '#13191C', grid: '#1C2429', art: '#D9DFDF' };
  const D = '"Big Shoulders Display", "Arial Narrow", Impact, sans-serif', B = 'Barlow, "Segoe UI", Roboto, Arial, sans-serif', M = '"IBM Plex Mono", Menlo, monospace';
  x.fillStyle = C.bg; x.fillRect(0, 0, W, H);
  x.strokeStyle = C.line; x.lineWidth = 1; x.globalAlpha = .5;
  for (let i = 0; i <= W; i += 40) { x.beginPath(); x.moveTo(i + .5, 0); x.lineTo(i + .5, H); x.stroke(); }
  for (let j = 0; j <= H; j += 40) { x.beginPath(); x.moveTo(0, j + .5); x.lineTo(W, j + .5); x.stroke(); }
  x.globalAlpha = 1;
  const P = 64;
  x.textBaseline = 'alphabetic';
  const logo = await loadImg('icons/logo-192.webp');
  if (logo) { x.save(); x.shadowColor = 'rgba(155,123,255,.6)'; x.shadowBlur = 24; x.drawImage(logo, P - 6, 16, 82, 82); x.restore(); }
  else {
    x.font = `800 46px ${D}`; x.fillStyle = C.ink; x.fillText('KIT', P, 104);
    const lw = x.measureText('KIT ').width; x.fillStyle = C.accent; x.fillText('UP', P + lw, 104);
  }
  x.font = `500 24px ${M}`; x.fillStyle = C.muted; x.textAlign = 'right'; x.fillText(`MW4 · PLAYER LEVEL ${req.lvl}+`, W - P, 100); x.textAlign = 'left';
  let y = 200;
  x.font = `800 104px ${D}`; x.fillStyle = C.ink;
  wrapText(x, L.name.toUpperCase(), W - P * 2).slice(0, 2).forEach(line => { x.fillText(line, P, y, W - P * 2); y += 100; });
  y -= 24;
  x.font = `800 48px ${D}`; x.fillStyle = C.accent; x.fillText(arch.name.toUpperCase(), P, y);
  x.font = `500 30px ${B}`; x.fillStyle = C.muted;
  wrapText(x, arch.blurb, W - P * 2).slice(0, 2).forEach(l => { y += 42; x.fillText(l, P, y); });
  // primary weapon plate
  y += 34;
  const pTop = y, pH = 630 - pTop, pw = S.W[L.p.w];
  const plate = () => { x.beginPath(); if (x.roundRect) x.roundRect(P, pTop, W - P * 2, pH, 22); else x.rect(P, pTop, W - P * 2, pH); };
  x.save(); plate(); x.fillStyle = C.plate; x.fill(); x.clip();
  x.strokeStyle = C.grid; x.lineWidth = 2;
  for (let i = P; i <= W - P; i += 36) { x.beginPath(); x.moveTo(i, pTop); x.lineTo(i, pTop + pH); x.stroke(); }
  for (let j = pTop; j <= pTop + pH; j += 36) { x.beginPath(); x.moveTo(P, j); x.lineTo(W - P, j); x.stroke(); }
  x.restore();
  plate(); x.strokeStyle = C.line; x.lineWidth = 2; x.stroke();
  const photo = pw.photo ? await loadImg(pw.photo) : null;
  if (photo) {
    x.save(); plate(); x.fillStyle = '#0E1214'; x.fill(); x.clip();
    const bw = W - P * 2, k = Math.min(bw / photo.naturalWidth, (pH * 1.18) / photo.naturalHeight);
    const dw = photo.naturalWidth * k, dh = photo.naturalHeight * k;
    x.drawImage(photo, P + (bw - dw) / 2, pTop + (pH - dh) / 2, dw, dh);
    x.restore(); plate(); x.strokeStyle = C.line; x.lineWidth = 2; x.stroke();
  } else {
    const eqP = L.p.att.map(a => a.s), blkP = L.p.apex && pw.apex ? pw.apex.blocks : [];
    const sp = x.createRadialGradient(W / 2, pTop + pH / 2, 0, W / 2, pTop + pH / 2, (W - P * 2) * 0.55);
    sp.addColorStop(0, 'rgba(150,175,182,.22)'); sp.addColorStop(1, 'rgba(150,175,182,0)');
    x.save(); plate(); x.clip(); x.fillStyle = sp; x.fillRect(P, pTop, W - P * 2, pH); x.restore();
    drawArtCanvas(x, pw, eqP, blkP, P + 44, pTop + 30, W - P - 44, pTop + pH - 44);
  }
  if (L.p.apex) { x.font = `700 24px ${M}`; x.fillStyle = C.accent; x.textAlign = 'right'; x.fillText('APEX', W - P - 26, pTop + 44); x.textAlign = 'left'; }
  y = 690;
  const colW = 600;
  const block = (label, slot, size, withAtt) => {
    const w = S.W[slot.w];
    x.font = `500 24px ${M}`; x.fillStyle = C.muted; x.fillText(label, P, y); y += size * .92;
    x.font = `800 ${size}px ${D}`; x.fillStyle = C.ink; x.fillText(w.name.toUpperCase(), P, y, colW);
    y += 44;
    if (withAtt) {
      x.font = `500 30px ${B}`; x.fillStyle = C.muted;
      const att = slot.att.map(a => a.n || a.s);
      x.fillText(wrapText(x, att.length ? att.join(' · ') : (w.slots.length ? 'No attachments' : S.C[w.cat].one), colW)[0], P, y, colW);
      y += 52;
    }
  };
  block('PRIMARY', L.p, 72, true);
  block(L.perks.includes('overkill') ? 'SECOND PRIMARY' : 'SECONDARY', L.s, 56, false);
  // radar
  const rcx = 868, rcy = 800, R = 96;
  const pt = (i, v) => { const a = -Math.PI / 2 + i * 2 * Math.PI / 5; return [rcx + Math.cos(a) * R * v / 5, rcy + Math.sin(a) * R * v / 5]; };
  const path = vals => { x.beginPath(); AXES.forEach((a, i) => { const [px, py] = pt(i, typeof vals === 'number' ? vals : Math.max(.35, vals[a])); i ? x.lineTo(px, py) : x.moveTo(px, py); }); x.closePath(); };
  x.strokeStyle = C.line; x.lineWidth = 2; path(5); x.stroke(); path(2.5); x.stroke();
  AXES.forEach((a, i) => { const [px, py] = pt(i, 5); x.beginPath(); x.moveTo(rcx, rcy); x.lineTo(px, py); x.stroke(); });
  path(sc); x.fillStyle = 'rgba(155,123,255,.28)'; x.fill(); x.strokeStyle = C.accent; x.lineWidth = 4; x.stroke();
  x.font = `500 20px ${M}`; x.fillStyle = C.muted; x.textAlign = 'center';
  AXES.forEach((a, i) => { const [px, py] = pt(i, 6.4); x.fillText(a.toUpperCase(), px, py + 7); });
  x.textAlign = 'left';
  // equipment + perks
  y = 950;
  const col = (label, lines, cx) => {
    let yy = y;
    x.font = `500 24px ${M}`; x.fillStyle = C.muted; x.fillText(label, cx, yy); yy += 44;
    x.font = `600 34px ${B}`; x.fillStyle = C.ink;
    lines.forEach(l => { x.fillText(l, cx, yy, W / 2 - P - 20); yy += 44; });
    return yy;
  };
  col('EQUIPMENT', [byId(g.lethals, L.lethal).name, byId(g.tacticals, L.tactical).name, byId(g.fieldUpgrades, L.fu).name], P);
  col('PERKS', L.perks.map(id => byId(g.perks, id).name), W / 2 + 20);
  // ladder, pinned to the bottom of the card
  const hard = L.perks.includes('hardline');
  const ks = L.ks.map(id => byId(g.killstreaks, id)).map(k => ({ n: k.name, c: k.kills - (hard ? 1 : 0) })).sort((a, b) => a.c - b.c);
  x.font = `500 24px ${M}`; x.fillStyle = C.muted; x.fillText(`${hard ? 'KILLSTREAKS · HARDLINE' : 'KILLSTREAKS'}  ·  OPERATOR ${L.op.toUpperCase()}`, P, H - 214);
  const lx0 = P + 20, lx1 = W - P - 20, ly = H - 124;
  x.fillStyle = C.line; x.fillRect(lx0, ly - 2, lx1 - lx0, 4);
  for (let i = 0; i <= 12; i++) { const tx = lx0 + (lx1 - lx0) * i / 12; x.fillRect(tx - 1, ly - 12, 2, 24); }
  ks.forEach((k, i) => {
    const tx = lx0 + (lx1 - lx0) * k.c / 12;
    x.fillStyle = C.accent; x.beginPath(); x.arc(tx, ly, 26, 0, Math.PI * 2); x.fill();
    x.fillStyle = C.dark; x.font = `700 26px ${M}`; x.textAlign = 'center'; x.fillText(String(k.c), tx, ly + 9);
    x.fillStyle = C.ink; x.font = `600 28px ${B}`;
    const pos = k.c / 12; x.textAlign = pos < .2 ? 'left' : pos > .8 ? 'right' : 'center';
    const lxp = pos < .2 ? tx - 26 : pos > .8 ? tx + 26 : tx;
    x.fillText(k.n, lxp, i % 2 ? ly - 44 : ly + 64);
  });
  x.textAlign = 'left';
  x.fillStyle = C.accent; x.fillRect(0, H - 14, W, 14);
  return cv;
}

async function openCard() {
  toast('Drawing your card…');
  const cv = await makeCard();
  const url = cv.toDataURL('image/png');
  const sheet = document.getElementById('sheet');
  document.getElementById('card-img').src = url;
  const btns = document.getElementById('card-btns'), dl = document.getElementById('card-dl'), sh = document.getElementById('card-share');
  btns.hidden = inFrame;
  dl.href = url; dl.download = (S.L.name || 'loadout').replace(/[^a-z0-9]+/gi, '-').toLowerCase() + '.png';
  S.cardBlob = null; sh.hidden = true;
  if (!inFrame && navigator.canShare) {
    cv.toBlob(b => {
      if (!b) return;
      const f = new File([b], dl.download, { type: 'image/png' });
      try { if (navigator.canShare({ files: [f] })) { S.cardBlob = f; sh.hidden = false; } } catch (e) {}
    }, 'image/png');
  }
  document.getElementById('card-hint').textContent = inFrame ? 'Press and hold the image (or right-click it) to save it.' : 'Press and hold the image to save it, or use the buttons.';

}

  const p = S.patches[0];
  const cats = PATCH_CATS.map(([k, name, blurb, icon]) => {
    const ic = `<span class="pc-ic"><svg viewBox="0 0 24 24" aria-hidden="true">${icon}</svg></span>`;
    if (!p) return `<div class="pcat">${ic}<span class="pcat-t"><b>${name}</b><small>${blurb}</small></span></div>`;
    const items = patchItems(p, k);
    return dd('pt-' + k, `${ic}${name}`, items.length ? `${items.length}` : 'None', items.length ? `<ul class="changes">${items.join('')}</ul>` : '<p class="small muted">Nothing in this update.</p>');
  }).join('');
  return `<section class="sec">
    <div><h2 class="h">Patch notes</h2><p class="sub">Every update, newest first. Gun changes link to that gun's page.</p></div>
    ${patchHero(p, false)}
    ${p ? '' : `<p class="small muted">MW4 launches ${esc(fmtDay(S.g.meta.launch))}. The first update usually lands in launch week, and each section below fills in when it does.</p>`}
    <div class="dds pcats">${cats}</div>
    ${p && p.url ? `<a href="${esc(p.url)}" target="_blank" rel="noopener">Full patch notes on callofduty.com</a>` : ''}
    ${S.patches.length > 1 ? `<h3 class="h3" style="margin-top:8px">Earlier updates</h3>${S.patches.slice(1).map(patchCard).join('')}` : ''}
  </section>`;
}

/* ---------- saved loadouts ---------- */
function readSaved() { try { const a = JSON.parse(localStorage.getItem(KEY) || '[]'); return Array.isArray(a) ? a : []; } catch (e) { return []; } }
function writeSaved(a) { try { localStorage.setItem(KEY, JSON.stringify(a)); return true; } catch (e) { return false; } }

/* ---------- theme ---------- */
function setTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  try { localStorage.setItem('lhq.theme', t); } catch (e) {}
  syncTheme();
}
function syncTheme() {
  const light = document.documentElement.getAttribute('data-theme') === 'light';
  const b = document.getElementById('theme-b');
  if (b) b.setAttribute('aria-label', light ? 'Switch to dark mode' : 'Switch to light mode');
  const m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute('content', '#100D17');
}

/* ---------- unlock moment ---------- */
const UNLOCK = {
  g: { name: 'Gold', c: '#F0B11E' }, p: { name: 'Platinum', c: '#DDE5E8' },
  h: { name: 'Harmonic Break', c: '#F0695E' }, div: { name: 'Divergence', c: '#56D7F0' }
};
function celebrate(kind, w, a, b) {
  const C = S.g.camos, el = document.getElementById('unlock');
  let name, img, color, sub, k = 'Camo unlocked';
  if (kind === 'm') {
    const m = C.mastery[a][b];
    name = m.name; img = m.img; color = '#9B7BFF';
    k = `${a === 'dmz' ? 'DMZ' : 'Multiplayer'} Mastery ${b + 1}`; sub = m.req;
  } else {
    const u = UNLOCK[kind];
    name = u.name; color = u.c;
    img = { g: C.gold.img, p: C.platinum.img, h: C.harmonic.img, div: C.divergence.img }[kind];
    sub = kind === 'div' ? `Harmonic Break on all ${S.g.weapons.length} weapons. Mastery is open.` : w.name + (a ? ` · ${a}` : '');
    if (kind === 'div') k = 'Completionist camo';
  }
  el.style.setProperty('--uc', color);
  document.getElementById('unlock-k').textContent = k;
  document.getElementById('unlock-img').src = img;
  document.getElementById('unlock-img').alt = name + ' camo';
  document.getElementById('unlock-t').textContent = name;
  document.getElementById('unlock-s').textContent = sub;
  el.hidden = false;
  el.classList.remove('go'); void el.offsetWidth; el.classList.add('go');
  setTimeout(() => { const ok = document.getElementById('unlock-ok'); if (ok && !el.hidden) ok.focus({ preventScroll: true }); }, 50);
}
function closeUnlock() { const el = document.getElementById('unlock'); if (el) el.hidden = true; }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeUnlock(); });

/* ---------- toast ---------- */
let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, 2600);
}

/* ---------- events ---------- */
function rerenderBuild(focusId) {
  sanitize(S.L);
  viewEl.innerHTML = renderBuild();
  if (focusId) { const el = document.getElementById(focusId); if (el) el.focus(); }
}

document.addEventListener('toggle', e => {
  const d = e.target;
  if (d && d.dataset && d.dataset.dd && S.camoOpen) { if (d.open) S.camoOpen.add(d.dataset.dd); else S.camoOpen.delete(d.dataset.dd); }
}, true);
function camoTap(t) {
  const d = t.dataset, i = Number(d.i);
  if (d.cm) { const r = cw(d.cm); r.m = r.m === i ? i - 1 : i; }
  else if (d.cs) { const r = cw(d.cs); r.s[i] = !r.s[i]; }
  else if (d.cpy) { const r = cw(d.cpy); r.py[i] = !r.py[i]; }
  else if (d.ct) {
    const w = S.W[d.ct], r = cw(d.ct), k = d.k;
    const open = k === 'g' ? true : k === 'p' ? platOpen(w) : hbOpen();
    if (!r[k] && !open) return;
    if (r[k]) {
      r[k] = false;
      if (k === 'g') { r.p = false; r.h = false; } else if (k === 'p') r.h = false;
    } else {
      let filled = false;
      if (k === 'g' && !goldOpen(w)) { r.m = 8; r.s = [true, true, true]; filled = true; }
      r[k] = true;
      if (k === 'h' && divergence()) celebrate('div', w);
      else celebrate(k, w, filled ? 'Military and Special filled in too' : '');
    }
  } else if (d.cmast) {
    const st = mastery(d.cmast), open = divergence() && (i === 0 || st[i - 1]);
    if (!st[i] && !open) return;
    st[i] = !st[i];
    if (st[i]) celebrate('m', null, d.cmast, i);
  }
  saveCamo();
  const y = window.scrollY; render(); window.scrollTo(0, y);
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-go],[data-gun],[data-cat],[data-gear],[data-cgal],[data-cmode],[data-cm],[data-cs],[data-ct],[data-cpy],[data-cmast],[data-act],[data-att-add],[data-att-del],[data-att-use],[data-ltab]');
  if (!t || !S.g) return;
  if (t.dataset.ltab) {
    S.liveTab = t.dataset.ltab;
    const card = document.getElementById('live'), w = S.W[S.gun];
    if (card && w) { card.outerHTML = liveCard(w); const b = document.querySelector(`[data-ltab="${S.liveTab}"]`); if (b) b.focus(); }
    return;
  }
  if (t.dataset.attUse) {
    const wid = t.dataset.attUse, k = t.dataset.k, s = t.dataset.s, n = t.dataset.n, w = S.W[wid];
    const swapped = S.L[k].w !== wid;
    if (swapped) S.L[k] = { w: wid, att: [], apex: false };
    const sl = S.L[k], ex = sl.att.find(x => x.s === s);
    if (sl.apex && w.apex && w.apex.blocks.includes(s)) { toast(`The Apex blocks the ${s} slot.`); return; }
    if (ex && ex.n === n) { sl.att.splice(sl.att.indexOf(ex), 1); toast(`Took ${n} off`); }
    else if (ex) { ex.n = n; toast(`Swapped in ${n}`); }
    else if (sl.att.length >= limit()) { toast(`Already ${limit()} attachments on this gun. Remove one first.`); return; }
    else { sl.att.push({ s, n }); toast(swapped ? `${w.name} is now in "${S.L.name}" with ${n}` : `${n} added (${sl.att.length}/${limit()})`); }
    sanitize(S.L);
    const y = window.scrollY; render(); window.scrollTo(0, y);
    return;
  }
  if (t.dataset.go) { go(t.dataset.go); return; }
  if (t.dataset.gun) { go('g-' + t.dataset.gun); return; }
  if (t.dataset.cat) { S.cat = t.dataset.cat; render(); return; }
  if (t.dataset.gear) { S.gearCat = t.dataset.gear; render(); return; }
  if (t.dataset.cgal) { S.camoGal = t.dataset.cgal; const y = window.scrollY; render(); window.scrollTo(0, y); return; }
  if (t.dataset.cmode) { S.camoMode = t.dataset.cmode; S.camo.mode = S.camoMode; saveCamo(); render(); return; }
  if (t.dataset.cm || t.dataset.cs || t.dataset.ct || t.dataset.cpy || t.dataset.cmast) { camoTap(t); return; }
  if (t.dataset.attAdd) {
    const k = t.dataset.attAdd, slot = S.L[k], w = S.W[slot.w];
    const blocked = slot.apex ? w.apex.blocks : [];
    const free = w.slots.find(s => !blocked.includes(s) && !slot.att.some(a => a.s === s));
    if (free && slot.att.length < limit()) { slot.att.push({ s: free, n: '' }); rerenderBuild(`b-${k}-n${slot.att.length - 1}`); }
    return;
  }
  if (t.dataset.attDel) {
    const [k, i] = t.dataset.attDel.split(':');
    S.L[k].att.splice(Number(i), 1); rerenderBuild();
    return;
  }
  const act = t.dataset.act;
  if (act === 'use') {
    S.L[t.dataset.slot] = { w: t.dataset.id, att: [], apex: false };
    toast(`${S.W[t.dataset.id].name} set as ${t.dataset.slot === 'p' ? 'primary' : 'secondary'}`);
    go('build');
  } else if (act === 'lvl-up' || act === 'lvl-dn') {
    const cur = S.lvl || (act === 'lvl-up' ? 0 : 2);
    setLvl(cur + (act === 'lvl-up' ? 1 : -1)); render();
  } else if (act === 'fav') {
    const id = t.dataset.id, w = S.W[id];
    if (S.favs.has(id)) { S.favs.delete(id); toast(`${w.name} removed from saved`); } else { S.favs.add(id); toast(`${w.name} saved`); }
    saveFavs();
    const list = document.getElementById('g-list');
    if (list && S.view === 'guns' && S.cat !== 'saved') {
      list.querySelectorAll(`[data-act="fav"][data-id="${id}"]`).forEach(b => { const on = S.favs.has(id); b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); b.setAttribute('aria-label', (on ? 'Remove ' + w.name + ' from saved' : 'Save ' + w.name)); });
      const sc = document.querySelector('[data-cat="saved"]'); if (sc) sc.textContent = `Saved${S.favs.size ? ' ' + S.favs.size : ''}`;
    } else { const y = window.scrollY; render(); window.scrollTo(0, y); }
  } else if (act === 'search') {
    go('guns');
    setTimeout(() => { const q = document.getElementById('g-q'); if (q) q.focus(); }, 30);
  } else if (act === 'theme') {
    setTheme(document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
  } else if (act === 'unlock-close') {
    closeUnlock();
  } else if (act === 'camo-copy') {
    const code = camoCode();
    const field = document.getElementById('camo-code');
    const fallback = () => { field.value = code; field.focus(); field.select(); toast('Select the code and copy it'); };
    try { navigator.clipboard.writeText(code).then(() => toast('Progress code copied'), fallback); } catch (err) { fallback(); }
  } else if (act === 'camo-load') {
    try {
      const o = readCamoCode(document.getElementById('camo-code').value || '');
      S.camo = o; S.camoMode = o.mode === 'dmz' ? 'dmz' : 'mp'; saveCamo(); render(); toast('Camo progress loaded');
    } catch (err) { toast("That code didn't work. Make sure you copied all of it."); }
  } else if (act === 'equip') {
    const cat = t.dataset.gcat, item = byId(S.g[cat], t.dataset.id);
    if (!item) return;
    if (cat === 'perks') S.L.perks[item.slot - 1] = item.id;
    else if (cat === 'lethals') S.L.lethal = item.id;
    else if (cat === 'tacticals') S.L.tactical = item.id;
    else if (cat === 'fieldUpgrades') S.L.fu = item.id;
    sanitize(S.L); render(); toast(`${item.name} equipped in "${S.L.name}"`);
  } else if (act === 'use-op') {
    S.L.op = t.dataset.name; sanitize(S.L); render(); toast(`${S.L.op} is now your Operator in "${S.L.name}"`);
  } else if (act === 'apex-peek') {
    S.apexPeek = !S.apexPeek; render();
  } else if (act === 'vs-open') {
    go('vs');
  } else if (act === 'vs-with') {
    const w = S.W[t.dataset.id];
    const peer = S.g.weapons.find(x => x.cat === w.cat && x.id !== w.id) || S.g.weapons.find(x => x.id !== w.id);
    S.vs = [w.id, peer.id]; go('vs');
  } else if (act === 'copy') {
    const code = encode(S.L);
    const text = inFrame ? code : location.origin + location.pathname + '#' + code;
    const box = document.getElementById('code-out'), field = document.getElementById('code-field');
    box.hidden = false; field.value = text;
    const fallback = () => { field.focus(); field.select(); toast('Select the code below and copy it'); };
    try { navigator.clipboard.writeText(text).then(() => toast('Share code copied'), fallback); } catch (err) { fallback(); }
  } else if (act === 'card') {
    openCard();
  } else if (act === 'sheet-close') {
    document.getElementById('sheet').hidden = true;
  } else if (act === 'card-share') {
    if (S.cardBlob) navigator.share({ files: [S.cardBlob], title: S.L.name }).catch(() => {});
  } else if (act === 'roll') {
    S.L = rollClass(); rerenderBuild(); toast(S.lvl ? `Rolled from what you have at Level ${S.lvl}` : 'Rolled from everything in the game'); window.scrollTo(0, 0);
  } else if (act === 'save') {
    const a = readSaved().filter(s => s.name !== S.L.name);
    a.unshift({ name: S.L.name, code: encode(S.L), at: Date.now() });
    if (writeSaved(a.slice(0, 30))) { rerenderBuild(); toast(`Saved "${S.L.name}"`); }
    else toast("This browser won't save. Use Share code instead.");
  } else if (act === 'load') {
    const v = (document.getElementById('b-code') || {}).value || '';
    const L = decode(v);
    if (L) { S.L = L; rerenderBuild(); toast(`Loaded "${L.name}"`); window.scrollTo(0, 0); }
    else toast("That code didn't work. Make sure you copied all of it.");
  } else if (act === 'reset') {
    S.L = starter(); rerenderBuild(); toast('Reset to the Level 4 starter'); window.scrollTo(0, 0);
  } else if (act === 'saved-load') {
    const s = readSaved()[Number(t.dataset.i)], L = s && decode(s.code);
    if (L) { S.L = L; rerenderBuild(); toast(`Loaded "${L.name}"`); window.scrollTo(0, 0); }
  } else if (act === 'saved-del') {
    if (t.dataset.confirm !== '1') { t.dataset.confirm = '1'; t.textContent = 'Confirm'; return; }
    const a = readSaved(); const gone = a.splice(Number(t.dataset.i), 1)[0];
    writeSaved(a); rerenderBuild(); if (gone) toast(`Deleted "${gone.name}"`);
  } else if (act === 'meta-open') {
    const m = S.meta[Number(t.dataset.i)], L = m && decode(m.code);
    if (L) { S.L = L; go('build'); toast(`Loaded "${L.name}"`); }
  } else if (act === 'meta-load') {
    const m = S.meta[Number(t.dataset.i)], L = m && decode(m.code);
    if (L) { S.L = L; rerenderBuild(); toast(`Loaded "${L.name}"`); window.scrollTo(0, 0); }
  }
});

document.getElementById('sheet').addEventListener('click', e => { if (e.target.id === 'sheet') e.currentTarget.hidden = true; });
document.addEventListener('keydown', e => { if (e.key === 'Escape') document.getElementById('sheet').hidden = true; });

document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'g-q') { S.q = t.value; const list = document.getElementById('g-list'); if (list) list.innerHTML = gunList(); return; }
  if (t.dataset.bind === 'name') { S.L.name = t.value.slice(0, 40); return; }
  if (t.dataset.attName) { const [k, i] = t.dataset.attName.split(':'); const a = S.L[k].att[Number(i)]; if (a) a.n = t.value.slice(0, 40); }
});

document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'g-sort') { S.sort = t.value; const list = document.getElementById('g-list'); if (list) list.innerHTML = gunList(); return; }
  if (t.id === 'lvl-in') { if (t.value === '') return; setLvl(t.value); render(); return; }
  if (t.dataset.vs) { S.vs[Number(t.dataset.vs)] = t.value; render(); return; }
  if (!S.L) return;
  if (t.dataset.pick) { S.L[t.dataset.pick] = { w: t.value, att: [], apex: false }; rerenderBuild(); return; }
  if (t.dataset.attSlot) { const [k, i] = t.dataset.attSlot.split(':'); const a = S.L[k].att[Number(i)]; if (a) { a.s = t.value; if (attsFor(S.L[k].w).some(x => x.s === a.s)) a.n = ''; } rerenderBuild(`b-${k}-n${i}`); return; }
  if (t.dataset.attPick) { const [k, i] = t.dataset.attPick.split(':'); const a = S.L[k].att[Number(i)]; if (a) a.n = t.value; rerenderBuild(`b-${k}-n${i}`); return; }
  if (t.dataset.apex) {
    const k = t.dataset.apex, slot = S.L[k], w = S.W[slot.w];
    slot.apex = t.checked;
    if (slot.apex) {
      const dropped = slot.att.filter(a => w.apex.blocks.includes(a.s)).map(a => a.s);
      if (dropped.length) toast(`Removed ${dropped.join(', ')}. Blocked by the Apex.`);
    }
    rerenderBuild(); return;
  }
  if (t.dataset.eq) { S.L[t.dataset.eq] = t.value; rerenderBuild(); return; }
  if (t.dataset.perk) {
    const had = S.L.perks.includes('overkill');
    S.L.perks[Number(t.dataset.perk)] = t.value;
    if (had && !S.L.perks.includes('overkill') && cls(S.W[S.L.s.w]) === 'primary') toast('Secondary reset. Overkill was removed.');
    rerenderBuild(); return;
  }
  if (t.dataset.ks) { S.L.ks[Number(t.dataset.ks)] = t.value; rerenderBuild(); return; }
});

boot();

/* offline support: only on the real site, never inside a preview frame */
try {
  if (!inFrame && 'serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
  }
  window.addEventListener('offline', () => toast("You're offline. Everything you've opened still works."));
  window.addEventListener('online', () => toast('Back online'));
} catch (e) {}
})();
</script>
