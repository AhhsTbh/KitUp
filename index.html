<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="description" content="Kit Up: Modern Warfare 4 loadouts, meta builds, every attachment, camos, maps and patch notes."><meta name="theme-color" content="#100D17"><link rel="manifest" href="manifest.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Kit Up"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Kit Up</title>
<script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("lhq.theme")==="light"?"light":"dark")}catch(e){document.documentElement.setAttribute("data-theme","dark")}</script>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" type="image/webp" href="icons/logo-96.webp">
<link rel="apple-touch-icon" href="icons/logo-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;700&display=swap">
<style>
/* Layout: phone-first app shell. Sticky header, one scrolling column (max 880px), fixed bottom tab bar like the in-game menus.
   Visual language: weapon-select screen. Flat killfeed-style silhouettes on gridded plates, a topo-map hero, one amber accent for anything equipped or live. */
:root{
  --bg:#0B0911; --surface:#15121D; --raised:#1D1928; --line:#2B2539; --ink:#ECE9F3; --muted:#958EA8;
  --accent:#9B7BFF; --on-accent:#120A2E; --accent-text:#B49DFF; --gold-text:#F2B726;
  --buff:#62BE7C; --nerf:#E8645A; --adjust:#7AA9D6;
  --art:#DDD9E6; --sil:#5E5774; --plate:#120F1A; --grid:#1B1726; --spot:rgba(170,150,230,.30); --edge:rgba(255,255,255,.3); --topo:rgba(160,140,220,.14); --glow:rgba(155,123,255,.42); --halo:rgba(155,123,255,.13);
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Barlow","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#EEECF3; --surface:#FAF9FC; --raised:#FFFFFF; --line:#D6D1E2; --ink:#16131F; --muted:#5D5770;
    --accent:#9B7BFF; --on-accent:#120A2E; --accent-text:#5B3FC4; --gold-text:#875B00;
    --buff:#1F7F45; --nerf:#BE3A30; --adjust:#2B679F;
    --art:#2A2536; --sil:#B1AAC2; --plate:#F1EFF6; --grid:#E2DEEB; --spot:rgba(255,255,255,.85); --edge:rgba(0,0,0,.28); --topo:rgba(80,60,140,.12); --glow:rgba(155,123,255,0); --halo:rgba(155,123,255,.16);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#EEECF3; --surface:#FAF9FC; --raised:#FFFFFF; --line:#D6D1E2; --ink:#16131F; --muted:#5D5770;
  --accent:#9B7BFF; --on-accent:#120A2E; --accent-text:#5B3FC4; --gold-text:#875B00;
  --buff:#1F7F45; --nerf:#BE3A30; --adjust:#2B679F;
  --art:#2A2536; --sil:#B1AAC2; --plate:#F1EFF6; --grid:#E2DEEB; --spot:rgba(255,255,255,.85); --edge:rgba(0,0,0,.28); --topo:rgba(80,60,140,.12); --glow:rgba(155,123,255,0); --halo:rgba(155,123,255,.16);
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:radial-gradient(120% 420px at 50% 0,var(--halo),transparent) no-repeat,var(--bg);color:var(--ink);font:400 16px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
a{color:var(--accent-text)}
p{margin:0}
h1,h2,h3{margin:0;font-family:var(--f-display);text-transform:uppercase;letter-spacing:.02em;line-height:1;text-wrap:balance}
button{font:inherit;color:inherit}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.wrap{width:100%;max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:11px}
.brand{display:flex;align-items:baseline;gap:.28em;background:none;border:0;padding:0;cursor:pointer;font:800 1.55rem/1 var(--f-display);letter-spacing:.05em;text-transform:uppercase;color:var(--ink)}
.brand span{color:var(--accent-text)}
.top-tag{font:500 .7rem/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);padding:6px 8px;border-radius:999px;white-space:nowrap}

main{padding-block:18px calc(92px + env(safe-area-inset-bottom,0px))}
.stack{display:grid;gap:28px}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:2px;padding-block:6px}
@media (max-width:440px){.tabs .wrap{padding-inline:6px}.tab{font-size:.62rem;letter-spacing:.02em}}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;color:var(--muted);font:600 .7rem/1 var(--f-body);letter-spacing:.05em;text-transform:uppercase;padding:7px 0;border-radius:8px;cursor:pointer}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--accent-text)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:-7px;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--accent);box-shadow:0 0 12px var(--glow)}

/* type */
.h{font-weight:800;font-size:2rem}
.h3{font-weight:700;font-size:1.3rem}
.eyebrow,.lbl{font:500 .7rem/1.25 var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.lead{font-size:1.08rem;max-width:62ch}
.sec{display:grid;gap:14px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.sec-head .more{background:none;border:0;padding:0;color:var(--accent-text);font-weight:600;cursor:pointer}
.sub{color:var(--muted);margin-top:6px;max-width:60ch}

/* hero */
.hero{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;isolation:isolate}
.topo{position:absolute;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
.topo path{fill:none;stroke:var(--topo);stroke-width:1}
.hero-in::after{content:"";position:absolute;inset:10px;pointer-events:none;background-repeat:no-repeat;
  background-image:linear-gradient(var(--accent),var(--accent)),linear-gradient(var(--accent),var(--accent)),linear-gradient(var(--accent),var(--accent)),linear-gradient(var(--accent),var(--accent)),linear-gradient(var(--accent),var(--accent)),linear-gradient(var(--accent),var(--accent)),linear-gradient(var(--accent),var(--accent)),linear-gradient(var(--accent),var(--accent));
  background-position:0 0,0 0,100% 0,100% 0,0 100%,0 100%,100% 100%,100% 100%;
  background-size:18px 2px,2px 18px,18px 2px,2px 18px,18px 2px,2px 18px,18px 2px,2px 18px}
.hero-in{position:relative;display:grid;gap:14px;padding:26px 24px 22px}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.coord{font:500 .66rem/1 var(--f-mono);letter-spacing:.1em;color:var(--muted);white-space:nowrap}
.hero h1{font-size:clamp(1.9rem,8vw,2.8rem);font-weight:800}
.hero-date{font-weight:600;font-size:1rem;color:var(--muted)}
.timer{display:flex;align-items:flex-start;gap:.06em;font:800 clamp(3.6rem,18vw,6.6rem)/.9 var(--f-display);color:var(--accent-text);text-shadow:0 0 28px var(--glow)}
.t-grp{display:grid;justify-items:center;gap:8px}
.t-num{display:flex}
.t-num .d{display:inline-block;width:.56em;text-align:center}
.t-sep{opacity:.45}
.t-lbl{font:500 .64rem/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.modes{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.modes li{display:inline-flex;align-items:center;gap:7px;padding:7px 11px;border:1px solid var(--line);border-radius:999px;background:var(--raised);font-weight:600;font-size:.88rem}
.modes small{color:var(--muted);font-weight:500;font-size:.8rem}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.live{background:var(--buff)}
.tally{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin:0;border-top:1px solid var(--line);background:var(--surface)}
.tally div{padding:12px 14px 14px;min-width:0;border-left:1px solid var(--line)}
.tally div:first-child{border-left:0;padding-left:24px}
.tally dt{font:500 .62rem/1.2 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tally dd{margin:4px 0 0;font:800 1.9rem/1 var(--f-display);font-variant-numeric:tabular-nums}

/* plates + weapon art */
.plate{position:relative;display:block;border-radius:10px;border:1px solid var(--line);background-color:var(--plate);
  background-image:radial-gradient(60% 75% at 50% 50%,var(--spot),transparent),linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:100% 100%,16px 16px,16px 16px;background-position:center,-1px -1px,-1px -1px;overflow:hidden}
.plate > svg{display:block;width:100%;height:auto}
.photo{display:block;width:100%;height:auto;aspect-ratio:360/140;object-fit:contain}
.photo.flip{transform:scaleX(-1)}
.plate:has(> .photo),.road-card .mini:has(.photo){background:#0E1214;border-color:#232B30}
.photo.apexp{aspect-ratio:auto}
.cc-arts .plate:has(> .photo){padding:18px 0 0}
.credit{margin-top:-8px}
.road-card .mini .photo{border-radius:6px}
.plate > .lvl{position:absolute;top:7px;left:7px}
.plate .corner{position:absolute;top:9px;right:10px;font:500 .62rem/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent-text)}
.art .pt{fill:var(--art);stroke:var(--edge);stroke-width:.7;paint-order:stroke}
.art .ln{fill:none;stroke:var(--art);stroke-linecap:round;stroke-linejoin:round}
.art-map .pt{fill:var(--sil)}
.art-map .ln{fill:none;stroke:var(--sil);stroke-linecap:round;stroke-linejoin:round}
.art .pt.eq,.art-map .pt.eq{fill:var(--accent)}
.art .ln.eq,.art-map .ln.eq{stroke:var(--accent)}
.art .pt.blk,.art-map .pt.blk{fill:none;stroke:var(--nerf);stroke-width:1.4;stroke-dasharray:3 3}
.art .ln.blk,.art-map .ln.blk{stroke:var(--nerf);stroke-dasharray:3 3}
.gs-lead{stroke:var(--sil);stroke-width:1}
.gs-lead.eq{stroke:var(--accent)}
.gs-lead.blk{stroke:var(--nerf);opacity:.6}
.gs-dot{stroke-width:1.6}
.gs-dot.open{fill:var(--plate);stroke:var(--muted)}
.gs-dot.eq{fill:var(--accent);stroke:var(--accent)}
.gs-dot.blk{fill:var(--plate);stroke:var(--nerf)}
.gs-x{stroke:var(--nerf);stroke-width:1.4}
.gs-lbl{font-family:var(--f-mono);font-size:10px;font-weight:500;fill:var(--muted)}
.gs-lbl.eq{fill:var(--accent-text);font-weight:700}
.gs-lbl.blk{fill:var(--nerf)}
.gs-key{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.gs-key span{display:inline-flex;align-items:center;gap:6px}
.gs-key i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--muted);display:inline-block}
.gs-key i.eq{background:var(--accent);border-color:var(--accent)}
.gs-key i.blk{border-color:var(--nerf)}

/* gun of the day */
.spot{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 16px 10px 10px;cursor:pointer}
.spot:hover{border-color:var(--accent)}
.spot-body{display:grid;gap:7px;min-width:0}
.spot-name{font:800 clamp(2rem,7vw,2.7rem)/.95 var(--f-display);text-transform:uppercase;letter-spacing:.02em}
.spot-feel{font-size:.95rem;color:var(--muted)}
.spot-feel b{color:var(--ink)}
.spot-apex{font:500 .68rem/1.3 var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--accent-text)}

/* weapon select tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(10.2rem,1fr));gap:10px}
.tile{display:grid;gap:7px;align-content:start;width:100%;min-width:0;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 6px 12px;cursor:pointer}
.tile:hover{border-color:var(--accent)}
.tile-lvl{font:500 .62rem/1 var(--f-mono);letter-spacing:.08em;color:var(--muted);padding:4px 6px 0}
.tile-lvl.got{color:var(--buff)}
.tile-lvl.locked{opacity:.7}
.tile-name{font:700 1.22rem/1.05 var(--f-display);text-transform:uppercase;letter-spacing:.02em;padding:0 6px;overflow-wrap:anywhere}
.tile-sub{font:500 .7rem/1.25 var(--f-mono);letter-spacing:.04em;color:var(--muted);padding:0 6px;font-variant-numeric:tabular-nums}
.tile .bar{width:auto;margin:0 6px}

/* compare */
.vs-plates{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.vs-badge{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--on-accent);border:4px solid var(--bg);font:800 1.2rem/1 var(--f-display);box-shadow:0 0 18px var(--glow)}

/* road to 55 */
.road-top{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.road-next{flex:1 1 14rem;min-width:0;font-size:1rem}
.road-next b{color:var(--accent-text)}
.stepper{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--raised)}
.stepper button{width:44px;border:0;background:none;font-size:1.4rem;line-height:1;cursor:pointer;color:var(--ink)}
.stepper input{width:4.2rem;border:0;border-left:1px solid var(--line);border-right:1px solid var(--line);border-radius:0;text-align:center;font:800 1.6rem/1 var(--f-display);background:var(--surface);padding:6px 0;-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.lvl-step{display:grid;gap:6px}
.road{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:6px;scrollbar-width:thin}
.road-card{flex:0 0 9.6rem;scroll-snap-align:start;display:grid;gap:6px;align-content:start;padding:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);min-height:7.5rem}
.road-card .road-lvl{font:800 1.9rem/1 var(--f-display);color:var(--muted)}
.road-card .ri{display:block;font-size:.88rem;font-weight:600;line-height:1.25}
.road-card .rk{display:block;font:500 .6rem/1.3 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.road-card small{color:var(--muted);font-size:.82rem}
.road-card.done{opacity:.55}
.road-card.done .road-lvl::after{content:" ✓";font-size:1rem;color:var(--buff)}
.road-card.next{border-color:var(--accent);background:var(--raised);opacity:1;box-shadow:0 0 0 3px var(--glow)}
.road-card.next .road-lvl{color:var(--accent-text)}
.road-card .mini{display:block;margin:-4px -4px 0;border-radius:6px;background:var(--plate);border:1px solid var(--line)}
.road-card .mini svg{display:block;width:100%;height:auto}

/* generic blocks */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:10px}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:18px;display:grid;gap:6px;color:var(--muted)}
.empty h3{color:var(--ink);font-size:1.25rem;font-weight:700}
.tag{display:inline-block;font:500 .64rem/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;padding:5px 7px;border-radius:5px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.buff{color:var(--buff);border-color:currentColor}
.tag.nerf{color:var(--nerf);border-color:currentColor}
.tag.adjust{color:var(--adjust);border-color:currentColor}
.lvl{font:500 .7rem/1 var(--f-mono);letter-spacing:.06em;padding:6px 7px;border-radius:5px;background:var(--raised);border:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
.lvl.got{color:var(--buff);border-color:color-mix(in srgb,var(--buff) 55%,transparent)}
.lvl.locked{color:var(--muted);opacity:.75}

/* news */
.news{display:grid;border-top:1px solid var(--line)}
.news a{display:grid;grid-template-columns:5.6rem minmax(0,1fr);gap:12px;padding:13px 0;border-bottom:1px solid var(--line);color:inherit;text-decoration:none}
.news .tag{justify-self:start;align-self:start;margin-top:2px}
.news b{display:block;font-weight:600}
.news small{display:block;color:var(--muted);font-size:.88rem;margin-top:2px}

/* forms */
input,select{font:500 1rem/1.2 var(--f-body);color:var(--ink);background:var(--raised);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:44px;width:100%;min-width:0}
select{appearance:none;-webkit-appearance:none;padding-right:32px;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 17px) 52%,calc(100% - 12px) 52%;background-size:5px 5px;background-repeat:no-repeat}
input::placeholder{color:var(--muted)}
.tools{display:flex;gap:8px}
.tools input{flex:1 1 auto}
.tools select{flex:0 0 9.5rem;width:9.5rem}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chips.wrapped{flex-wrap:wrap;overflow:visible}
.chip{flex:none;font:600 .82rem/1 var(--f-body);letter-spacing:.03em;padding:9px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:700 .92rem/1 var(--f-body);letter-spacing:.05em;text-transform:uppercase;padding:13px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);cursor:pointer;min-height:44px;text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.btn-row .btn{flex:1 1 9rem}
.linkish{background:none;border:0;padding:0;color:var(--accent-text);font-weight:600;cursor:pointer;text-align:left}

/* armory */
.group{display:grid;gap:6px}
.group > h3{font-size:1.05rem;font-weight:700;color:var(--muted);margin-top:8px}
.gun{display:grid;grid-template-columns:minmax(0,1fr) 4.9rem auto;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer}
.gun:hover{border-color:var(--muted)}
.gun-main{display:grid;gap:3px;min-width:0}
.gun-name{font:700 1.25rem/1.05 var(--f-display);text-transform:uppercase;letter-spacing:.02em}
.gun-sub{font-size:.85rem;color:var(--muted)}
.gun-rpm{display:grid;justify-items:end;gap:5px}
.gun-rpm .mono{font-size:.9rem}
.gun-rpm small{font:500 .58rem/1 var(--f-mono);color:var(--muted);letter-spacing:.08em;margin-left:2px}
.bar{display:block;width:100%;height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.back{justify-self:start;background:none;border:0;color:var(--accent-text);font-weight:600;padding:6px 0;cursor:pointer}
.gun-title{font-size:clamp(2.7rem,12vw,4.2rem);font-weight:800}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:0}
.stats div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;min-width:0}
.stats dt{font:500 .64rem/1.2 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stats dd{margin:5px 0 0;font:800 1.9rem/1 var(--f-display);font-variant-numeric:tabular-nums}
.stats dd small{font:500 .64rem var(--f-mono);color:var(--muted);margin-left:3px;letter-spacing:.06em}
.feel{display:grid;gap:4px;padding:12px 14px;border-radius:var(--r);background:var(--raised);border:1px solid var(--line)}
.feel p{font-size:1rem}
.feel b{color:var(--accent-text)}
.unlock-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.note{font-size:.85rem;color:var(--muted)}
.apex-card{background:var(--raised);border:1px solid var(--accent);border-radius:var(--r);padding:14px;display:grid;gap:9px}
.apex-card h3{font-size:1.55rem;font-weight:800;color:var(--accent-text)}

.gs-wrap{display:grid;gap:10px}
.mtog{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--raised);flex:none}
.mtog button{border:0;background:none;padding:7px 11px;font:600 .74rem/1 var(--f-body);color:var(--muted);cursor:pointer}
.mtog button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.csum{gap:12px}
.csum-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.cpct{display:block;font:800 2.8rem/1 var(--f-display);color:var(--accent-text)}
.bar.big{height:8px;border-radius:4px}
.cstats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:0}
.cstats div{border-top:1px solid var(--line);padding-top:7px;min-width:0}
.cstats dt{font:500 .6rem/1.2 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.cstats dd{margin:4px 0 0;font:800 1.6rem/1 var(--f-display);font-variant-numeric:tabular-nums}
.cstats dd small{font:500 .7rem var(--f-mono);color:var(--muted)}
.ladder-row{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x proximity;margin-top:-6px}
.lcard{flex:0 0 13.5rem;scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:grid;align-content:start}
.limg{display:block;aspect-ratio:640/296;background:#0E1214}
.limg img{display:block;width:100%;height:100%;object-fit:cover}
.lbody{display:grid;gap:5px;padding:10px 12px 12px}
.ltop{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ltop b{font:800 1.2rem/1 var(--f-display);text-transform:uppercase}
.lbody p{font-size:.84rem;color:var(--muted);line-height:1.35}
.crows{display:grid;gap:8px}
.crow{display:grid;grid-template-columns:5.4rem minmax(0,1fr);gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px}
.cthumb{border:0;padding:0;border-radius:8px;overflow:hidden;background:#0E1214;cursor:pointer}
.cthumb .photo,.cthumb svg{display:block;width:100%}
.cmain{display:grid;gap:7px;min-width:0}
.ctop{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ctop b{font:700 1.1rem/1 var(--f-display);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.cstat{flex:none;font:500 .6rem/1.2 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.cstat.gd,.cstat.go{color:var(--gold-text)}.cstat.pt{color:var(--ink)}.cstat.hb{color:var(--nerf)}
.cpips{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.pips{display:inline-flex;gap:3px}
.pip{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--line);background:var(--raised);padding:0;cursor:pointer}
.pip.on{background:#6E8A4E;border-color:#8BAA63}
.pip.sp{border-radius:3px;transform:rotate(45deg) scale(.82)}
.pip.sp.on{background:#3FA7B5;border-color:#6CCAD6}
.ctiers{display:flex;gap:5px;flex-wrap:wrap}
.ctiers .tier{padding:5px 8px;font-size:.6rem;min-height:26px}
.tier{border:1px solid var(--line);background:var(--raised);color:var(--ink);border-radius:999px;padding:6px 10px;font:700 .68rem/1 var(--f-body);letter-spacing:.05em;text-transform:uppercase;cursor:pointer;min-height:30px}
.tier:disabled{opacity:.4;cursor:not-allowed}
.tier.t-g.on{background:linear-gradient(180deg,#F6D776,#C99A22);border-color:#C99A22;color:#2A1D02}
.tier.t-p.on{background:linear-gradient(180deg,#F3F6F7,#AEB8BD);border-color:#AEB8BD;color:#1B2023}
.tier.t-h.on{background:linear-gradient(180deg,#F07A6E,#B4372D);border-color:#B4372D;color:#fff}
.tier.t-m.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.mtiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(14rem,1fr));gap:10px}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:grid;align-content:start}
.mcard.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
.mimg{display:block;aspect-ratio:640/296;background:#0E1214}
.mimg img{display:block;width:100%;height:100%;object-fit:cover}
.mbody{display:grid;gap:5px;padding:10px 12px 12px;justify-items:start}
.mbody h3{font-size:1.3rem;font-weight:800}
.mbody p{font-size:.86rem;color:var(--muted)}
@media (max-width:600px){.mtiles{gap:8px}.mcard{grid-template-columns:7.2rem minmax(0,1fr);align-items:center}.mimg{height:100%;aspect-ratio:auto}.mbody{padding:10px}.mbody h3{font-size:1.1rem}.mbody p{font-size:.8rem}}
.cpanel{border-top:1px solid var(--line);padding-top:16px;margin-top:6px}
.milgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.mil{position:relative;border:1.5px solid var(--line);border-radius:8px;overflow:hidden;padding:0;background:#0E1214;cursor:pointer;opacity:.55}
.mil img{display:block;width:100%;aspect-ratio:300/286;object-fit:cover}
.mil span{position:absolute;left:0;right:0;bottom:0;padding:3px 5px;font:600 .6rem/1.2 var(--f-mono);color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.8))}
.mil.on{opacity:1;border-color:#8BAA63}
.mil.on::after{content:"✓";position:absolute;top:4px;right:5px;font-weight:800;color:#B6D98A;text-shadow:0 1px 2px #000}
.spcs{display:grid;gap:6px}
.spc{display:grid;grid-template-columns:4.4rem minmax(0,1fr) 22px;gap:10px;align-items:center;text-align:left;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);padding:6px;cursor:pointer;color:var(--ink)}
.spc img,.spc .spc-ph{width:100%;aspect-ratio:300/286;object-fit:cover;border-radius:6px;display:grid;place-items:center;background:#0E1214;color:var(--muted)}
.spc-t{display:grid;gap:3px;min-width:0}
.spc-t b{font-weight:700}
.spc-t small{color:var(--muted);font-size:.8rem;line-height:1.3}
.spc .chk{font-weight:800;color:var(--buff)}
.spc.wide{grid-template-columns:5.6rem minmax(0,1fr) 22px}
.spc.wide img{aspect-ratio:640/296}
.spc.on{border-color:#3FA7B5}
.ccomps{display:grid;gap:6px}
.ccomp{display:grid;grid-template-columns:5.6rem minmax(0,1fr) auto;gap:10px;align-items:center;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);padding:6px}
.ccomp img{width:100%;aspect-ratio:640/296;object-fit:cover;border-radius:6px}
.ccomp div{display:grid;gap:3px;min-width:0}
.ccomp small{color:var(--muted);font-size:.8rem;line-height:1.3}
.ccomp.locked img{filter:grayscale(1) brightness(.6)}
.ccomp.on{border-color:var(--accent)}
.dds{display:grid;gap:8px}
.dd{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.dd summary{list-style:none;display:flex;align-items:center;gap:10px;padding:12px 14px;min-height:54px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.dd summary::-webkit-details-marker{display:none}
.dd summary:hover .dd-c{stroke:var(--accent-text)}
.dd-t{flex:1 1 auto;min-width:0;font:700 1.18rem/1.05 var(--f-display);text-transform:uppercase;letter-spacing:.02em}
.dd-m{flex:none;font:500 .66rem/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.dd-c{flex:none;width:20px;height:20px;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dd[open] .dd-c{transform:rotate(180deg)}
.dd[open] summary{border-bottom:1px solid var(--line)}
.dd[open] .dd-m{color:var(--accent-text)}
.dd-b{display:grid;gap:8px;padding:10px}
.dd .crow,.dd .spc,.dd .ccomp,.dd .lcard,.dd .mcard{background:var(--raised)}
.dd .ladder-row{margin:0}
.top-r{display:flex;align-items:center;gap:8px;min-width:0}
.theme-b{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--muted);display:grid;place-items:center;cursor:pointer;padding:0}
.theme-b svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8}
.theme-b svg path{fill:currentColor;stroke:none}
.theme-b svg path.ln{fill:none;stroke:currentColor;stroke-linecap:round}
.theme-b:hover{color:var(--ink);border-color:var(--muted)}
.pip.sw.on,.hsw i.sw.on{background:#2A3136 var(--sw) center/cover no-repeat;border-color:rgba(255,255,255,.5)}
:root[data-theme="light"] .pip.sw.on,:root[data-theme="light"] .hsw i.sw.on{border-color:rgba(0,0,0,.35)}
.hsw{display:inline-flex;gap:2px;flex:none}
.hsw i{width:11px;height:11px;border-radius:2px;border:1px solid var(--line);opacity:.9}
.hsw.dia{gap:5px;padding:0 2px}
.hsw.dia i{transform:rotate(45deg) scale(.85)}
.hsw i.gen.on{background:#3FA7B5;border-color:#6CCAD6}
.cdots{display:inline-flex;gap:3px;flex:none}
.cdots i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--line)}
.cdots i.pr{border-color:var(--muted);background:linear-gradient(90deg,var(--muted) 50%,transparent 50%)}
.cdots i.gd{border-color:#C99A22;background:linear-gradient(135deg,#F6D776,#C99A22)}
.cdots i.pt{border-color:#9AA6AC;background:linear-gradient(135deg,#FFFFFF,#AEB8BD)}
.cdots i.hb{border-color:#B4372D;background:linear-gradient(135deg,#F07A6E,#B4372D)}
.tier.on.t-g,.tier.on.t-p,.tier.on.t-h,.tier.on.t-m,.ccomp.on img{position:relative;overflow:hidden}
.tier.on.t-g::after,.tier.on.t-p::after,.tier.on.t-h::after,.tier.on.t-m::after{content:"";position:absolute;inset:-2px;pointer-events:none;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.7) 50%,transparent 65%);transform:translateX(-130%)}
.unlock{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:24px 20px calc(24px + env(safe-area-inset-bottom,0px));background:radial-gradient(70% 55% at 50% 42%,color-mix(in srgb,var(--uc,#9B7BFF) 30%,transparent),rgba(6,8,10,.94) 72%),rgba(6,8,10,.6);overflow:hidden;cursor:pointer}
.unlock-in{position:relative;display:grid;justify-items:center;gap:12px;text-align:center;width:100%;max-width:440px;isolation:isolate}
.unlock-in::before{content:"";position:absolute;left:50%;top:44%;width:170vmax;height:170vmax;margin:-85vmax 0 0 -85vmax;z-index:-1;pointer-events:none;
  background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--uc,#9B7BFF) 16%,transparent) 0 7deg,transparent 7deg 18deg);
  -webkit-mask-image:radial-gradient(circle,#000 6%,transparent 34%);mask-image:radial-gradient(circle,#000 6%,transparent 34%)}
.unlock-k{font:500 .72rem/1 var(--f-mono);letter-spacing:.22em;text-transform:uppercase;color:var(--uc,#9B7BFF)}
.unlock-img{position:relative;width:100%;border-radius:14px;overflow:hidden;background:#0E1214;border:1px solid color-mix(in srgb,var(--uc,#9B7BFF) 65%,transparent);box-shadow:0 0 70px color-mix(in srgb,var(--uc,#9B7BFF) 45%,transparent)}
.unlock-img img{display:block;width:100%;aspect-ratio:640/296;object-fit:cover}
.unlock-img::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.55) 48%,transparent 66%);transform:translateX(-130%)}
.unlock h2{font-size:clamp(2.8rem,14vw,4.6rem);font-weight:800;color:#fff;text-shadow:0 0 34px color-mix(in srgb,var(--uc,#9B7BFF) 80%,transparent)}
.unlock p{color:#C9D0D2;font-weight:600;max-width:34ch}
.unlock .btn{margin-top:6px;min-width:10rem}
@media (prefers-reduced-motion:no-preference){
  .tier.on.t-g::after,.tier.on.t-p::after,.tier.on.t-h::after,.tier.on.t-m::after{animation:sheen 3.6s ease-in-out infinite}
  .unlock.go{animation:u-fade .25s ease-out}
  .unlock.go .unlock-in::before{animation:u-spin 24s linear infinite}
  .unlock.go .unlock-img{animation:u-pop .55s cubic-bezier(.2,1.5,.4,1) both}
  .unlock.go .unlock-img::after{animation:sheen-once 1.1s .45s ease-in-out both}
  .unlock.go h2{animation:u-rise .45s .2s ease-out both}
  .unlock.go .unlock-k,.unlock.go p,.unlock.go .btn{animation:u-rise .45s .32s ease-out both}
}
@keyframes sheen{0%,58%{transform:translateX(-130%)}88%,100%{transform:translateX(130%)}}
@keyframes sheen-once{from{transform:translateX(-130%)}to{transform:translateX(130%)}}
@keyframes u-fade{from{opacity:0}to{opacity:1}}
@keyframes u-spin{to{transform:rotate(360deg)}}
@keyframes u-pop{from{opacity:0;transform:scale(.72)}to{opacity:1;transform:none}}
@keyframes u-rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
/* ===== Kit Up look ===== */
body{background:radial-gradient(90% 420px at 85% -60px,rgba(155,123,255,.22),transparent 70%) no-repeat,radial-gradient(70% 360px at 0 -40px,rgba(108,64,230,.16),transparent 70%) no-repeat,var(--bg)}
.top,body::before{background:#100D17}
.top{border-bottom-color:#241F31;backdrop-filter:saturate(1.2)}
.top .wrap{padding-block:7px}
.brand img{display:block;height:64px;width:64px;filter:brightness(1.15) saturate(1.15) drop-shadow(0 0 6px rgba(155,123,255,.85)) drop-shadow(0 0 16px rgba(155,123,255,.45))}
.top.compact .brand img{height:44px;width:44px}
.top .wrap{padding-block:4px}
@media (prefers-reduced-motion:no-preference){.brand img{transition:height .2s ease,width .2s ease}}
.hero2-in{position:relative;z-index:1}
.hero-logo{position:absolute;right:6px;bottom:8px;width:150px;height:150px;z-index:0;pointer-events:none;opacity:.92;filter:blur(1.2px) brightness(1.15) saturate(1.15) drop-shadow(0 0 10px rgba(155,123,255,.8)) drop-shadow(0 0 28px rgba(155,123,255,.45))}
.hero2 .hero-glow{position:absolute;right:-30px;bottom:-30px;width:240px;height:240px;border-radius:50%;background:radial-gradient(closest-side,rgba(155,123,255,.45),transparent);z-index:0;pointer-events:none}
@media (min-width:600px){.hero-logo{width:210px;height:210px;right:28px;bottom:auto;top:50%;transform:translateY(-50%)}.hero2 .hero-glow{right:0;bottom:auto;top:50%;width:300px;height:300px;transform:translateY(-50%)}}
@media (prefers-reduced-motion:no-preference){.hero-logo{animation:logo-in .6s cubic-bezier(.2,1.4,.4,1) both}}
@keyframes logo-in{from{opacity:0;transform:scale(.8) rotate(-8deg)}}
@media (prefers-reduced-motion:no-preference) and (min-width:600px){.hero-logo{animation:none}}
.top .theme-b{color:#B9B2CC;border-color:#2E2840}
.top .theme-b:hover{color:#fff;border-color:#4A4166}
.h{font-size:1.7rem}
.sec-head .more{color:var(--muted);font-weight:600;font-size:.9rem}
.sec-head .more:hover{color:var(--accent-text)}
.btn.outline{background:transparent;color:#C9B8FF;border:1.5px solid #9B7BFF;box-shadow:0 0 18px rgba(155,123,255,.25)}
.btn.outline:hover{background:rgba(155,123,255,.14)}
.btn.sm{min-height:36px;padding:9px 14px;font-size:.78rem}
.pill{display:inline-flex;align-items:center;font:600 .62rem/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;padding:5px 8px;border-radius:6px;background:rgba(155,123,255,.16);color:var(--accent-text);white-space:nowrap}
.pill.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.badge{display:inline-flex;font:600 .58rem/1 var(--f-mono);letter-spacing:.07em;text-transform:uppercase;padding:5px 7px;border-radius:5px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}

/* hero banner */
.hero2{position:relative;border-radius:16px;overflow:hidden;isolation:isolate;background:#0D0A14;border:1px solid #2E2742;
  --ink:#ECE9F3;--muted:#B5AEC8;--raised:rgba(255,255,255,.07);--line:rgba(255,255,255,.14);--accent-text:#B49DFF;color:var(--ink)}
.hero-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:68% 50%;z-index:-2;opacity:.85}
.hero2::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(11,8,18,.96) 0%,rgba(11,8,18,.82) 48%,rgba(20,10,40,.45) 100%),linear-gradient(0deg,rgba(11,8,18,.9) 0%,transparent 45%)}
.hero2::after{content:"";position:absolute;inset:auto -20% -40% 30%;height:70%;z-index:-1;background:radial-gradient(closest-side,rgba(155,123,255,.35),transparent);pointer-events:none}
.hero2-in{display:grid;gap:12px;padding:24px 20px 22px;justify-items:start}
.hero2 h1{font-size:clamp(2rem,9vw,2.9rem);font-weight:800;color:#fff}
.hero2 .eyebrow{color:#C3B6EA}
.hero-kick{font:700 1.15rem/1 var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:#B49DFF}
.hero2 .timer{color:#C5B3FF;text-shadow:0 0 30px rgba(155,123,255,.55)}
.hero2 .hero-date{color:#B5AEC8}
.hero2 .modes li{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.14);color:#ECE9F3}
.hero-cta{margin-top:4px;min-width:11rem}

/* quick tiles */
.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.qt{display:grid;justify-items:center;align-content:center;gap:10px;min-height:96px;padding:14px 6px;border-radius:12px;border:1px solid var(--line);background:linear-gradient(180deg,var(--raised),var(--surface));color:var(--ink);cursor:pointer;font:700 .9rem/1 var(--f-display);letter-spacing:.05em;text-transform:uppercase}
.qt svg{width:30px;height:30px;fill:none;stroke:var(--accent);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 8px var(--glow))}
.qt:hover{border-color:var(--accent)}

/* carousel */
.carousel{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:6px;scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
.ccard{flex:0 0 9.4rem;scroll-snap-align:start;display:grid;gap:7px;justify-items:start;text-align:left;padding:6px 6px 10px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.ccard .plate{width:100%}
.ccard b{font:700 1.05rem/1.05 var(--f-display);text-transform:uppercase;letter-spacing:.02em;padding:0 4px}
.ccard .pill{margin-left:4px}
.ccard:hover{border-color:var(--accent)}

/* purple light on photo plates */
.plate:has(> .photo),.road-card .mini:has(.photo),.wc-img{background:#0D0A14;border-color:#2A2338}
.plate:has(> .photo)::after,.wc-img::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(60% 55% at 50% 100%,rgba(155,123,255,.38),transparent 72%);mix-blend-mode:screen}

/* weapon list cards */
.wlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(19rem,1fr));gap:8px}
.wcard{position:relative;display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.25fr);align-items:center;gap:6px;min-height:118px;padding:10px 10px 10px 14px;border-radius:12px;border:1px solid var(--line);background:linear-gradient(100deg,var(--surface) 40%,var(--raised));overflow:hidden}
.wcard:hover{border-color:var(--accent)}
.wcard:has(.wc-link:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.wc-txt{display:grid;gap:5px;justify-items:start;min-width:0;z-index:1}
.wc-txt .tile-lvl{padding:0}
.wc-name{font:800 1.45rem/1 var(--f-display);text-transform:uppercase;letter-spacing:.02em;margin:0}
.wc-link{all:unset;cursor:pointer;overflow-wrap:anywhere}
.wc-link::after{content:"";position:absolute;inset:0;z-index:1}
.wc-link:focus-visible{outline:none}
.wc-tag{font:700 .68rem/1.1 var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--accent-text)}
.wc-badges{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.wc-img{position:relative;display:block;border-radius:9px;overflow:hidden;border:1px solid #2A2338}
.wc-img .photo,.wc-img svg{display:block;width:100%}
.fav{position:absolute;top:6px;right:6px;z-index:2;width:34px;height:34px;display:grid;place-items:center;border:0;border-radius:8px;background:rgba(13,10,20,.55);color:#CFC6E6;cursor:pointer;padding:0}
.fav svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round}
.fav.on{color:#B49DFF}
.fav.on svg{fill:currentColor}

/* gun page */
.gun-bar{display:flex;justify-content:space-between;align-items:center;gap:10px}
.gun-bar .fav{position:static;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.gun-bar .fav.on{color:var(--accent-text);border-color:var(--accent)}
.back-b{display:inline-flex;align-items:center;gap:4px;background:none;border:0;padding:6px 6px 6px 0;color:var(--ink);font:700 1.05rem/1 var(--f-display);letter-spacing:.05em;text-transform:uppercase;cursor:pointer}
.back-b svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.gun-hero{box-shadow:0 18px 40px -18px rgba(155,123,255,.55)}
.gun-id{display:grid;gap:8px}
.gun-title{font-size:clamp(2.4rem,11vw,3.8rem)}
.gun-chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.smith,.statcard{gap:12px}
.srows{display:grid;border-top:1px solid var(--line)}
.srow{display:grid;grid-template-columns:30px minmax(0,1fr) auto 16px;align-items:center;gap:10px;padding:11px 2px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);text-align:left;cursor:pointer;font:inherit}
.srow:hover .s-v,.srow:hover .chev{color:var(--accent-text);stroke:var(--accent-text)}
.s-ic svg{width:24px;height:24px;fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.s-n{font-weight:600}
.s-v{font-size:.85rem;color:var(--muted)}
.srow.blk .s-n{text-decoration:line-through;color:var(--muted)}
.srow.blk .s-v{color:var(--nerf)}
.srow.blk .s-ic svg{stroke:var(--nerf)}
.chev{width:16px;height:16px;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sbar{display:grid;grid-template-columns:6.4rem minmax(0,1fr) 4.6rem;align-items:center;gap:10px;font-size:.92rem}
.sbar .bar{height:8px;border-radius:4px;background:var(--raised)}
.sbar .bar i{background:linear-gradient(90deg,#7A5BF0,#B49DFF);border-radius:4px;box-shadow:0 0 10px rgba(155,123,255,.45)}
.sbar b{font:700 .9rem/1 var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}

/* patch notes */
.phero{position:relative;display:block;width:100%;min-height:170px;border-radius:14px;overflow:hidden;isolation:isolate;border:1px solid #2E2742;background:#0D0A14;text-align:left;color:#fff;padding:0;cursor:default}
button.phero{cursor:pointer}
.phero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:60% 50%;z-index:-2;opacity:.8}
.phero::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(11,8,18,.95),rgba(11,8,18,.55) 60%,rgba(30,12,60,.25)),linear-gradient(0deg,rgba(11,8,18,.85),transparent 60%)}
.phero-in{display:grid;gap:6px;padding:22px 18px;max-width:80%}
.phero-t{font:800 clamp(1.8rem,8vw,2.4rem)/.95 var(--f-display);text-transform:uppercase;letter-spacing:.02em}
.phero-k{font:700 1rem/1 var(--f-display);letter-spacing:.16em;text-transform:uppercase;color:#B49DFF}
.phero-d{font:500 .72rem/1.2 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:#B5AEC8}
.phero-go{position:absolute;right:14px;bottom:14px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;border:1.5px solid #9B7BFF;background:rgba(13,10,20,.6)}
.phero-go .chev{stroke:#D7CCFF}
.pcat{display:grid;grid-template-columns:44px minmax(0,1fr);align-items:center;gap:12px;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.pc-ic{display:inline-grid;place-items:center;width:40px;height:40px;flex:none}
.pc-ic svg{width:30px;height:30px;fill:none;stroke:var(--accent);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 8px var(--glow))}
.pcat-t{display:grid;gap:3px}
.pcat-t b{font:700 1.15rem/1 var(--f-display);text-transform:uppercase;letter-spacing:.03em}
.pcat-t small{color:var(--muted);font-size:.86rem}
.pcats .dd-t{display:flex;align-items:center;gap:10px}
.pcats .dd .pc-ic{width:30px;height:30px}
.pcats .dd .pc-ic svg{width:24px;height:24px}
.changes li.pl{display:list-item;margin-left:1.1em;list-style:disc;color:var(--ink)}
.changes:has(li.pl){display:block}

/* tabs */
.tabs{background:#100D17;border-top-color:#241F31}
.tab{color:#8E87A2}
.tab[aria-current="page"]{color:#C5B3FF}
.tab[aria-current="page"] svg{filter:drop-shadow(0 0 6px rgba(155,123,255,.7))}
@media (max-width:420px){.wlist{grid-template-columns:1fr}.wc-name{font-size:1.35rem}}

.dd .pip:not(.on){background:var(--surface);border-color:color-mix(in srgb,var(--muted) 55%,var(--line))}
.dd .tier:not(.on){background:var(--surface)}
@media (prefers-reduced-motion:no-preference){.dd-c{transition:transform .2s}}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:4px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.seg-b{display:flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:9px;background:none;padding:11px 4px;font:700 .8rem/1 var(--f-body);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);cursor:pointer;min-width:0}
.seg-b small{font:500 .64rem/1 var(--f-mono);opacity:.8}
.seg-b[aria-selected="true"]{background:var(--accent);color:var(--on-accent)}
.gtiles,.otiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(10.2rem,1fr));gap:10px}
.gcard{display:grid;gap:6px;align-content:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 6px 12px;min-width:0}
.gcard.on,.ocard.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
.gimg{position:relative;display:block;border-radius:8px;overflow:hidden;background:#0E1214;aspect-ratio:16/9}
.gcard.sq .gimg{aspect-ratio:1/1}
.gimg img{display:block;width:100%;height:100%;object-fit:cover}
.gname{font:700 1.14rem/1.08 var(--f-display);text-transform:uppercase;letter-spacing:.02em;padding:0 6px}
.gabout{font-size:.84rem;color:var(--muted);padding:0 6px;line-height:1.35}
.gbtn{justify-self:start;margin:2px 6px 0;border:1px solid var(--line);background:var(--raised);color:var(--ink);border-radius:8px;padding:8px 12px;font:700 .72rem/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;cursor:pointer;min-height:36px}
.gbtn:hover{border-color:var(--accent)}
.gbtn.on{background:transparent;border-color:var(--accent);color:var(--accent-text);cursor:default}
.gon{margin:2px 6px 0;font:500 .64rem/1.2 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent-text)}
.gbadge{position:absolute;top:7px;left:7px;min-width:30px;height:30px;padding:0 7px;border-radius:15px;display:grid;place-items:center;background:var(--accent);color:var(--on-accent);font:700 .82rem/1 var(--f-mono)}
.grech{position:absolute;top:7px;right:7px;padding:5px 8px;border-radius:6px;font:600 .6rem/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;background:rgba(10,13,15,.85)}
.grech.fast{color:#7FD493}
.grech.medium{color:#F2C14E}
.grech.slow{color:#F07A6E}
.ocard{display:grid;align-content:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:0}
.oimg{display:block;aspect-ratio:1/1;background:#0E1214}
.oimg img{display:block;width:100%;height:100%;object-fit:cover}
.obody{display:grid;gap:5px;padding:10px 10px 12px}
.oname{font:800 1.3rem/1 var(--f-display);text-transform:uppercase;letter-spacing:.02em}
.ofac{font:500 .6rem/1.25 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ohow{font-size:.86rem;line-height:1.35}
.ocard .gbtn{margin:4px 0 0}
.cc-op{display:flex;align-items:center;gap:8px;min-width:0}
.cc-op img{width:34px;height:34px;border-radius:50%;object-fit:cover;border:1px solid var(--line);flex:none}
.cc-perks{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px}
.cc-perks span{display:inline-flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border:1px solid var(--line);border-radius:999px;background:var(--raised);font-weight:600;font-size:.92rem}
.cc-perks img{width:30px;height:30px;border-radius:50%;object-fit:cover}
.op-pick{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;align-items:end}
.op-pick img{width:64px;height:64px;border-radius:10px;object-fit:cover;border:1px solid var(--line)}
.chip.static{cursor:default;font-weight:500;background:var(--raised)}
.chip.blocked{text-decoration:line-through;color:var(--nerf);border-color:var(--nerf)}

/* compare */
.vs-pick{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center}
.vs-pick .vs-word{font:800 1.3rem/1 var(--f-display);color:var(--muted)}
.vs-names{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.vs-names h3{font-size:clamp(1.5rem,6vw,2.2rem);font-weight:800}
.vs-names h3:last-child{text-align:right}
.vs-rows{display:grid;gap:12px}
.vs-row{display:grid;grid-template-columns:minmax(0,1fr) 6.4rem minmax(0,1fr);gap:8px;align-items:center}
.vs-m{text-align:center;font:500 .64rem/1.2 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.vs-side{display:grid;gap:5px}
.vs-side .v{font:800 1.4rem/1 var(--f-display);font-variant-numeric:tabular-nums}
.vs-side.r{justify-items:end}
.vs-side .bar{height:6px;border-radius:3px}
.vs-side.l .bar{display:flex;justify-content:flex-end}
.vs-side.win .v{color:var(--accent-text)}
.vs-side:not(.win) .bar i{background:var(--muted)}
.take{display:grid;gap:8px;padding:14px;border-radius:var(--r);background:var(--raised);border:1px solid var(--line)}
.take ul{margin:0;padding-left:1.1em;display:grid;gap:4px}

/* patches */
.patch{display:grid;gap:9px;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.patch h3{font-size:1.35rem;font-weight:700}
.changes{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.changes li{display:grid;grid-template-columns:4.4rem minmax(0,1fr);gap:10px;align-items:start}
.changes .tag{justify-self:start;margin-top:2px}

/* shop */
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(15rem,1fr));gap:10px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:8px;align-content:start}
.item h3{font-size:1.35rem;font-weight:700}
.item ul{margin:0;padding-left:1.1em;color:var(--muted);font-size:.9rem}
.price{font:700 1.05rem var(--f-mono);color:var(--accent-text);font-variant-numeric:tabular-nums}
.item-top{display:flex;justify-content:space-between;align-items:center;gap:8px}

/* build */
.build-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.req{font:500 .72rem/1.3 var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.req b{color:var(--accent-text);font-size:1.05rem}
.classcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:16px}
.cc-head{display:grid;grid-template-columns:minmax(0,1fr) 9.5rem;gap:12px;align-items:center}
.cc-arts{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(0,1fr);gap:8px;align-items:stretch}
.cc-arts .plate{display:flex;align-items:center;padding:20px 0 2px;cursor:pointer;color:inherit;font:inherit}
.cc-arts .plate:hover{border-color:var(--accent)}
.cc-arts .plate svg{width:100%;height:auto;display:block}
.plate-lbl{position:absolute;top:8px;left:10px;font:500 .6rem/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.cc-name{font:800 1.75rem/1.05 var(--f-display);text-transform:uppercase;letter-spacing:.02em;background:transparent;border:0;border-bottom:1px dashed var(--line);border-radius:0;padding:2px 0 6px;min-height:0}
.arch{display:grid;gap:5px;min-width:0}
.arch b{font:800 1.45rem/1 var(--f-display);text-transform:uppercase;letter-spacing:.03em;color:var(--accent-text)}
.arch span{font-size:.92rem;color:var(--muted)}
.radar{width:100%;height:auto;display:block}
.rd-grid{fill:none;stroke:var(--line);stroke-width:1}
.rd-axis{stroke:var(--line);stroke-width:1}
.rd-shape{fill:var(--accent);fill-opacity:.25;stroke:var(--accent);stroke-width:2;stroke-linejoin:round}
.rd-pt{fill:var(--accent)}
.rd-lbl{font-family:var(--f-mono);font-size:10px;fill:var(--muted);letter-spacing:.06em}
.cc-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px}
.cc-grid > div{display:grid;gap:3px;align-content:start;min-width:0}
.cc-wide{grid-column:1 / -1}
.cc-grid b{font-weight:600;font-size:1.02rem}
.cc-grid small{color:var(--muted);font-size:.84rem}
.ladder{position:relative;height:100px;margin:0 14px}
.lad-track{position:absolute;left:0;right:0;top:49px;height:2px;background:var(--line)}
.lad-tick{position:absolute;top:45px;width:1px;height:10px;background:var(--line)}
.lad-end{position:absolute;top:58px;font:500 .62rem/1 var(--f-mono);color:var(--muted)}
.lad-m{position:absolute;top:0;bottom:0;width:0}
.lad-dot{position:absolute;top:36px;left:-14px;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--on-accent);font:700 .82rem/28px var(--f-mono);text-align:center}
.lad-lbl{position:absolute;left:0;white-space:nowrap;font-weight:600;font-size:.86rem;transform:translateX(-50%)}
.lad-m.up .lad-lbl{top:8px}
.lad-m.down .lad-lbl{bottom:8px}
.lad-m.al .lad-lbl{transform:translateX(-14px)}
.lad-m.ar .lad-lbl{transform:translateX(calc(-100% + 14px))}
.readout{display:grid;gap:10px}
.say{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;align-items:start;padding:12px 14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.say svg{width:20px;height:20px;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;margin-top:1px}
.say.good svg{stroke:var(--buff)}
.say.warn svg{stroke:var(--accent-text)}
.say b{display:block;font-weight:700}
.say p{color:var(--muted);font-size:.95rem}
.code-out{display:grid;gap:6px}
.code-out input{font:500 .8rem var(--f-mono)}
.edit{display:grid;gap:12px}
.edit > h3{font-size:1.3rem;font-weight:700}
.field{display:grid;gap:6px}
.slot-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mini{font-size:.86rem;color:var(--muted)}
.atts{display:grid;gap:8px}
.atts-head{display:flex;justify-content:space-between;align-items:center}
.att{display:grid;grid-template-columns:minmax(0,9rem) minmax(0,1fr) 44px;gap:6px}
.x{border:1px solid var(--line);background:var(--raised);color:var(--muted);border-radius:8px;font-size:1.25rem;line-height:1;cursor:pointer;min-width:44px;min-height:44px}
.add{justify-self:start;background:none;border:1px dashed var(--line);border-radius:8px;color:var(--accent-text);font-weight:600;padding:10px 12px;cursor:pointer}
.apex-toggle{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--raised)}
.apex-toggle.on{border-color:var(--accent)}
.apex-toggle input{width:20px;height:20px;min-height:0;padding:0;margin:1px 0 0;flex:none;accent-color:var(--accent)}
.apex-toggle b{display:block;font-weight:600}
.apex-toggle small{display:block;color:var(--muted);font-size:.84rem;margin-top:2px}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.saved-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.saved-row > div{min-width:0;display:grid;gap:3px}
.saved-row b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.saved-row small{color:var(--muted)}
.saved-row .btns{display:flex;gap:6px;flex:none}
.saved-row .btn{padding:10px 12px;font-size:.78rem;min-height:40px}

/* card sheet */
.sheet{position:fixed;inset:0;z-index:30;background:rgba(8,10,12,.72);display:flex;align-items:flex-end;justify-content:center;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet-in{width:100%;max-width:520px;max-height:100%;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:12px}
.sheet-head{display:flex;justify-content:space-between;align-items:center}
.sheet-head b{font:800 1.4rem/1 var(--f-display);text-transform:uppercase}
.sheet img{width:100%;border-radius:10px;border:1px solid var(--line);display:block}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:8px;font-weight:600;font-size:.92rem;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.25)}
.loading{padding:40px 0;color:var(--muted)}

@media (max-width:560px){
  .trio{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tools select{flex-basis:8.2rem;width:8.2rem}
}
@media (max-width:380px){
  .tally dd{font-size:1.55rem}
  .att{grid-template-columns:minmax(0,7.4rem) minmax(0,1fr) 44px}
  .cc-head{grid-template-columns:minmax(0,1fr) 8rem}
  .vs-row{grid-template-columns:minmax(0,1fr) 5.4rem minmax(0,1fr)}
}
@media (max-width:560px){
  .spot{grid-template-columns:1fr;padding:8px 8px 14px}
  .spot-body{padding:0 6px}
}
@media (prefers-reduced-motion: no-preference){
  .tab,.chip,.gun,.btn,.road-card,.tile,.spot{transition:color .15s,background-color .15s,border-color .15s,opacity .15s}
  .tile .art,.spot .art,.tile .photo,.spot .photo{transition:transform .25s ease}
  .tile:hover .art,.spot:hover .art,.tile:hover .photo,.spot:hover .photo{transform:translateX(4px)}
  .rd-shape{transition:all .25s ease}
}

/* early multiplayer card */
.early{display:grid;gap:12px;padding:16px;border-radius:14px;border:1px solid color-mix(in srgb,var(--buff) 45%,var(--line));background:linear-gradient(180deg,color-mix(in srgb,var(--buff) 9%,var(--surface)),var(--surface))}
.early-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.live-pill{display:inline-flex;align-items:center;gap:7px;font:700 .66rem/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--buff);padding:6px 9px;border-radius:999px;border:1px solid currentColor}
.live-pill i{width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}
.early h2{font-size:1.75rem;font-weight:800}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:11px;counter-reset:st}
.steps li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;counter-increment:st}
.steps li::before{content:counter(st);width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:700 .8rem/1 var(--f-mono);background:var(--raised);border:1px solid var(--line);color:var(--accent-text)}
.steps b{font-weight:600}
.steps small{display:block;color:var(--muted);font-size:.88rem;margin-top:2px}

/* tier list */
.tiers{display:grid;gap:10px}
.trow{display:grid;grid-template-columns:4.4rem minmax(0,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.tlet{display:grid;align-content:center;justify-items:center;gap:7px;padding:10px 4px;background:var(--raised);border-right:1px solid var(--line)}
.tlet b{font:800 2.7rem/1 var(--f-display);color:var(--muted)}
.tlet small{font:500 .54rem/1.25 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center}
.trow.t-s{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
.trow.t-s .tlet{background:var(--accent);border-color:var(--accent)}
.trow.t-s .tlet b,.trow.t-s .tlet small{color:var(--on-accent)}
.trow.t-a .tlet b{color:var(--accent-text)}
.tguns{display:flex;gap:6px;overflow-x:auto;padding:8px;scrollbar-width:none;scroll-snap-type:x proximity}
.tguns::-webkit-scrollbar{display:none}
.tgun{flex:0 0 8.6rem;scroll-snap-align:start;display:grid;gap:6px;text-align:left;background:none;border:1px solid transparent;border-radius:10px;padding:4px 4px 8px;cursor:pointer;color:var(--ink)}
.tgun:hover{border-color:var(--accent)}
.tgun .plate{width:100%}
.tgun b{font:700 1.02rem/1.05 var(--f-display);text-transform:uppercase;letter-spacing:.02em;padding:0 2px}
.tgun small{font:500 .62rem/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:0 2px}
.unranked{display:flex;flex-wrap:wrap;gap:6px}

/* meta builds */
.mbuilds{display:grid;grid-template-columns:repeat(auto-fill,minmax(19rem,1fr));gap:10px}
.mb{display:grid;gap:10px;align-content:start;padding:8px 8px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);min-width:0}
.mb > .plate{padding:0;width:100%;cursor:pointer}
.mb > .plate:hover{border-color:var(--accent)}
.mb-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:0 4px}
.mb-head h3{font-size:1.4rem;font-weight:800}
.mb-tier{flex:none;font:800 1.05rem/1 var(--f-display);padding:6px 9px;border-radius:6px;background:var(--raised);border:1px solid var(--line);color:var(--accent-text)}
.mb-tier.s{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.mb-role{font:500 .66rem/1.3 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent-text);padding:0 4px;margin-top:-4px}
.mb-note{color:var(--muted);font-size:.93rem;padding:0 4px}
.mb-att{list-style:none;margin:0;padding:0 4px;display:grid}
.mb-att li{display:grid;grid-template-columns:6.6rem minmax(0,1fr);gap:8px;align-items:baseline;padding:6px 0;border-bottom:1px dashed var(--line);font-size:.93rem}
.mb-att li:last-child{border-bottom:0}
.mb-att span{font:500 .64rem/1.3 var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.mb-att b{font-weight:600;overflow-wrap:anywhere}
.mb-kit{display:flex;gap:4px;flex-wrap:wrap;padding:0 4px}
.mb .btn-row{padding:0 4px}
.src{font-size:.84rem;color:var(--muted)}
.src a{color:var(--accent-text)}

/* maps and modes */
.mtiles2{display:grid;grid-template-columns:repeat(auto-fill,minmax(9.4rem,1fr));gap:8px}
.map{position:relative;display:grid;align-content:end;gap:5px;min-height:6.8rem;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--plate);overflow:hidden;isolation:isolate}
.map svg{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.map svg path{fill:none;stroke:color-mix(in srgb,var(--accent) 34%,transparent);stroke-width:1}
.map::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(0deg,var(--plate) 8%,transparent 70%)}
.map b{font:800 1.22rem/1 var(--f-display);text-transform:uppercase;letter-spacing:.02em}
.map small{font:500 .6rem/1.2 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.map.soon{border-style:dashed}
.map .when{position:absolute;top:9px;right:9px}
.carousel .map{flex:0 0 9.6rem;scroll-snap-align:start}
.modes2{display:flex;flex-wrap:wrap;gap:6px}
.mode{display:inline-flex;align-items:center;gap:7px;padding:9px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:.92rem}
.mode .pill{padding:4px 6px}
.mode.soon{border-style:dashed;color:var(--muted)}

/* attachment lists */
.sdd{border-bottom:1px solid var(--line)}
.sdd > summary{list-style:none;border-bottom:0;-webkit-tap-highlight-color:transparent}
.sdd > summary::-webkit-details-marker{display:none}
.sdd[open] > summary .dd-c{transform:rotate(180deg)}
.sdd[open] > summary .s-v{color:var(--accent-text)}
.alist{list-style:none;margin:0;padding:2px 0 12px 40px;display:grid;gap:5px}
.arow{display:grid;grid-template-columns:2.9rem minmax(0,1fr) auto;gap:10px;align-items:start;width:100%;text-align:left;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--raised);color:var(--ink);cursor:pointer;font:inherit}
.arow:hover{border-color:var(--accent)}
.arow.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--glow)}
.a-l{font:500 .66rem/1.7 var(--f-mono);letter-spacing:.05em;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.a-t{display:grid;gap:4px;min-width:0}
.a-t b{font-weight:600;overflow-wrap:anywhere}
.a-go{font:700 .62rem/1.8 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent-text)}
.arow.on .a-go{color:var(--buff)}
.fx{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:.78rem;line-height:1.35}
.fx i{font-style:normal}
.fx .up{color:var(--buff)}
.fx .dn{color:var(--nerf)}
.att-w{display:grid;gap:5px}
.att-w > .fx{padding:0 4px}
@media (max-width:420px){.alist{padding-left:0}}
@media (max-width:560px){.att{grid-template-columns:minmax(0,6.6rem) minmax(0,1fr) 44px}}

/* camo gallery + visible swatches */
.cgal{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:6px;scrollbar-width:none}
.cgal::-webkit-scrollbar{display:none}
.gcam{flex:0 0 15.5rem;scroll-snap-align:start;display:grid;align-content:start;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.cgal.sq .gcam{flex-basis:11.5rem}
.gcam-ph{width:100%;height:100%}
.gcam-ph,.spc .spc-ph{display:grid;place-items:center;align-content:center;gap:6px;background:radial-gradient(70% 70% at 50% 40%,rgba(155,123,255,.18),transparent),repeating-linear-gradient(135deg,#15111D 0 10px,#1A1524 10px 20px);color:#9B8FBF}
.gcam-ph .ph-d,.spc-ph .ph-d{font-size:1.6rem;line-height:1;color:#B49DFF}
.gcam-ph small{font:600 .6rem/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase}
.spc-ph small{font:600 .55rem/1.15 var(--f-mono);letter-spacing:.04em;text-transform:uppercase;text-align:center;padding:0 4px;color:#C9BFE8}
.gcam-img{position:relative;display:block;aspect-ratio:640/296;background:#0E1214}
.cgal.sq .gcam-img{aspect-ratio:300/286}
.gcam-img img{display:block;width:100%;height:100%;object-fit:cover}
.gcam-tag{position:absolute;top:8px;left:8px;font:600 .6rem/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;padding:5px 7px;border-radius:5px;background:rgba(13,10,20,.78);color:#E6DEFF}
.gcam-b{display:grid;gap:4px;padding:10px 12px 12px}
.gcam-b b{font:800 1.3rem/1 var(--f-display);text-transform:uppercase;letter-spacing:.02em}
.gcam-b small{color:var(--muted);font-size:.84rem;line-height:1.35}
.pip{width:24px;height:24px;border-radius:5px}
.cpips .pips{gap:4px}
.pip.sw,.dd .pip.sw:not(.on){background:#2A3136 var(--sw) center/cover no-repeat;border-color:transparent;opacity:.62;filter:saturate(.85)}
.pip.sw.on{opacity:1;filter:none;border-color:rgba(255,255,255,.8);box-shadow:0 0 10px rgba(155,123,255,.45)}
.pip.sw:hover{opacity:.8}
.tier.ic{display:inline-flex;align-items:center;gap:5px;padding-left:4px}
.tier .ti{width:17px;height:17px;border-radius:50%;flex:none;background:#2A3136 var(--sw) center/cover no-repeat;box-shadow:0 0 0 1px rgba(255,255,255,.3)}
.tier:disabled .ti{filter:saturate(.4)}
.crow{grid-template-columns:5.8rem minmax(0,1fr)}
.spc{grid-template-columns:5.6rem minmax(0,1fr) 22px}
@media (prefers-reduced-motion:no-preference){.sdd > summary .dd-c{transition:transform .2s}}

/* live stats */
.live{gap:14px}
.live .sec-head{align-items:center}
.mstat{display:grid;justify-items:end;gap:3px;text-align:right}
.mstat b{font:700 .66rem/1 var(--f-mono);letter-spacing:.09em;text-transform:uppercase;padding:6px 8px;border-radius:6px;border:1px solid var(--line);color:var(--ink);background:var(--raised)}
.mstat.hot b{background:var(--accent);border-color:var(--accent);color:var(--on-accent);box-shadow:0 0 14px var(--glow)}
.mstat small{font:500 .62rem/1 var(--f-mono);letter-spacing:.05em;color:var(--muted)}
.ttks{display:grid;gap:9px;padding:12px;border-radius:12px;background:var(--raised);border:1px solid var(--line)}
.ttk-h{display:flex;justify-content:space-between}
.ttk{display:grid;grid-template-columns:4.6rem minmax(0,1fr) 4.2rem;grid-template-areas:"r b v" "r b k";column-gap:10px;align-items:center}
.ttk-r{grid-area:r;font:500 .7rem/1.2 var(--f-mono);letter-spacing:.04em;color:var(--muted)}
.ttk .bar{grid-area:b;height:10px;border-radius:5px;background:var(--surface);overflow:hidden}
.ttk .bar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,#5F44C9,#9B7BFF)}
.ttk.top .bar i{background:linear-gradient(90deg,#7A5BF0,#C9B8FF);box-shadow:0 0 12px rgba(155,123,255,.6)}
.ttk b{grid-area:v;font:700 1rem/1 var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.ttk small{grid-area:k;font:500 .6rem/1.2 var(--f-mono);letter-spacing:.04em;color:var(--muted);text-align:right}
.ttk.top small{color:var(--accent-text)}
.ltabs{display:flex;gap:4px;padding:4px;border:1px solid var(--line);border-radius:12px;background:var(--raised);overflow-x:auto;scrollbar-width:none}
.ltabs::-webkit-scrollbar{display:none}
.ltabs button{flex:1 0 auto;border:0;border-radius:9px;background:none;padding:9px 4px;font:600 .76rem/1 var(--f-body);color:var(--muted);cursor:pointer}
.ltabs button[aria-selected="true"]{background:var(--accent);color:var(--on-accent)}
.lts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:640px){.lts{grid-template-columns:repeat(4,minmax(0,1fr))}}
.lt{display:grid;gap:6px;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:var(--raised);min-width:0}
.lt b{font:800 1.55rem/1 var(--f-display);letter-spacing:.01em;font-variant-numeric:tabular-nums}
.lt small{font:500 .62rem/1.2 var(--f-mono);letter-spacing:.04em;color:var(--muted)}
.lt.top{border-color:color-mix(in srgb,var(--accent) 60%,var(--line));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 35%,transparent)}
.lt.top small{color:var(--accent-text)}
.live a{color:var(--accent-text)}
.gbuilds{gap:12px}
.gb{display:grid;gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:var(--raised)}
.gb .mb-role,.gb .mb-att{padding:0}
.mb-att li.apx span,.mb-att li.apx b{color:var(--accent-text)}
.tmark{display:inline-grid;place-items:center;min-width:1.35rem;height:1.35rem;padding:0 4px;margin-right:7px;border-radius:5px;font:800 .82rem/1 var(--f-display);vertical-align:1px;background:var(--raised);border:1px solid var(--line);color:var(--muted)}
.tmark.t-s{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tmark.t-a{color:var(--accent-text);border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.tmark.big{height:auto;padding:5px 8px;margin:0;font:600 .62rem/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;border-radius:6px}
.vs-names .tmark{margin:0 0 0 8px;vertical-align:6px}
.vs-sh{margin:10px 0 2px;text-align:center}
.vs-rows .vs-sh:first-child{margin-top:0}
.tgun .pk{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:center;padding:0 2px}
.pkb{height:4px;border-radius:2px;background:var(--raised);overflow:hidden}
.pkb i{display:block;height:100%;background:var(--accent);border-radius:2px}
.tgun .pk small{padding:0;color:var(--ink)}
.trow.t-2nd .tlet b{font-size:1.6rem}
.trow.t-b .tlet b{color:var(--ink)}

/* coming up */
.ev{flex:0 0 10.4rem;scroll-snap-align:start;display:grid;gap:6px;align-content:start;text-align:left;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font:inherit;min-height:7rem}
.ev-d{font:500 .66rem/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ev b{font:800 1.2rem/1.05 var(--f-display);text-transform:uppercase;letter-spacing:.02em}
.ev small{color:var(--muted);font-size:.84rem;margin-top:auto}
.ev.now{border-color:var(--buff)}
.ev.now small{color:var(--buff);font-weight:600}
.ev.big{border-color:var(--accent);background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 16%,var(--surface)),var(--surface));box-shadow:0 0 0 3px var(--glow)}
.ev.big small{color:var(--accent-text);font-weight:600}
.ev.done{opacity:.55}

/* seasons + prestige */
.s1{position:relative;isolation:isolate;overflow:hidden;border-radius:16px;border:1px solid var(--accent);background:linear-gradient(160deg,#1B1430,#0D0A14 70%);box-shadow:0 0 0 3px var(--glow)}
.s1::after{content:"";position:absolute;inset:auto -20% -50% 25%;height:80%;z-index:-1;background:radial-gradient(closest-side,rgba(155,123,255,.4),transparent)}
.s1 .topo path{stroke:rgba(180,160,255,.16)}
.s1-in{display:grid;gap:8px;padding:22px 20px}
.s1 .eyebrow{color:#C3B6EA}
.s1 h1{font-size:clamp(2.2rem,10vw,3.2rem);font-weight:800;color:#fff}
.s1-cd{display:flex;align-items:baseline;gap:10px}
.s1-cd b{font:800 4.2rem/.9 var(--f-display);color:#C5B3FF;text-shadow:0 0 30px rgba(155,123,255,.55)}
.s1-cd b.live{font-size:2.6rem;color:#7FE09A;text-shadow:none}
.s1-cd span{font:600 .8rem/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:#B5AEC8}
.s1-date{font:500 .78rem/1.2 var(--f-mono);letter-spacing:.05em;color:#D9D2F0}
.s1-note{color:#B5AEC8;font-size:.95rem;max-width:56ch}
.tl{list-style:none;margin:0;padding:0;display:grid;position:relative}
.tl::before{content:"";position:absolute;left:4.55rem;top:10px;bottom:10px;width:2px;background:var(--line)}
.tl li{display:grid;grid-template-columns:4.2rem minmax(0,1fr);gap:22px;align-items:start;padding:9px 0;position:relative}
.tl li::before{content:"";position:absolute;left:4.3rem;top:13px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--muted)}
.tl-d{font:600 .72rem/1.5 var(--f-mono);letter-spacing:.04em;color:var(--muted);text-align:right}
.tl-t{display:grid;gap:2px}
.tl-t b{font-weight:600}
.tl-t small{color:var(--muted);font-size:.84rem}
.tl li.done{opacity:.55}
.tl li.done::before{background:var(--muted)}
.tl li.now::before{border-color:var(--buff);background:var(--buff);box-shadow:0 0 10px var(--buff)}
.tl li.now small{color:var(--buff);font-weight:600}
.tl li.big::before{border-color:var(--accent);background:var(--accent);box-shadow:0 0 12px var(--glow);width:14px;height:14px;left:4.24rem}
.tl li.big b{font:800 1.2rem/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.02em;color:var(--accent-text)}
.tl.pm .tl-d{color:var(--accent-text)}
.lvls{display:grid;grid-template-columns:repeat(auto-fit,minmax(10rem,1fr));gap:8px}
.lvc{display:grid;gap:4px;align-content:start;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.lvc b{font:800 1.7rem/1 var(--f-display);color:var(--accent-text)}
.lvc span{font-weight:700}
.lvc small{color:var(--muted);font-size:.86rem;line-height:1.35}
.paths{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:10px}
.path{display:grid;gap:8px;align-content:start;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.path.cl{border-color:var(--accent);background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 12%,var(--surface)),var(--surface))}
.path h3{font-size:1.35rem;font-weight:800}
.path ul{margin:0;padding-left:1.1em;display:grid;gap:4px;font-size:.93rem}
.path.cl .lbl{color:var(--accent-text)}
.p1t{list-style:none;margin:0;padding:0;display:grid;gap:0}
.p1t li{display:grid;grid-template-columns:4.4rem minmax(0,1fr);gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:.93rem}
.p1t li:last-child{border-bottom:0}
.p1t b{font:600 .72rem/1.6 var(--f-mono);letter-spacing:.04em;color:var(--accent-text)}
.prs{display:grid;grid-template-columns:repeat(auto-fill,minmax(19rem,1fr));gap:8px}
.pr{display:grid;grid-template-columns:3.4rem minmax(0,1fr);gap:12px;align-items:start;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);position:relative}
.pr-n{display:grid;justify-items:center;align-content:center;gap:2px;height:3.4rem;border-radius:10px;background:var(--raised);border:1px solid var(--line);font:800 1.7rem/1 var(--f-display);color:var(--accent-text)}
.pr-n small{font:500 .48rem/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pr-b{display:grid;gap:6px;min-width:0}
.pr-i{font:800 1.15rem/1.05 var(--f-display);text-transform:uppercase;letter-spacing:.02em}
.pr-v{display:flex;flex-wrap:wrap;gap:6px}
.pr-v span{display:grid;gap:3px;padding:6px 9px;border-radius:8px;border:1px solid var(--line);background:var(--raised);font-weight:600;font-size:.9rem}
.pr-v small{font:500 .54rem/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pr-v .cl{border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.pr-v .cl small{color:var(--accent-text)}
.pr-x{color:var(--muted);font-size:.84rem}
.pr-g{grid-column:1 / -1;padding:0;width:100%;cursor:pointer}
.pr-g:hover{border-color:var(--accent)}
.pyro{display:grid;grid-template-columns:repeat(auto-fit,minmax(9.5rem,1fr));gap:8px}
.py{display:grid;gap:4px;padding:12px;border-radius:12px;border:1px solid color-mix(in srgb,#E8645A 40%,var(--line));background:linear-gradient(160deg,rgba(232,100,90,.12),var(--surface) 70%)}
.py-i{font:700 .62rem/1 var(--f-mono);color:#F08A6E}
.py b{font:800 1.1rem/1.05 var(--f-display);text-transform:uppercase;letter-spacing:.02em}
.py small{color:var(--muted);font-size:.82rem}

/* DMZ */
.dmz-hero{position:relative;isolation:isolate;overflow:hidden;border-radius:16px;border:1px solid #2E3A2C;background:linear-gradient(160deg,#121A12,#0B0E0B 75%)}
.dmz-hero > svg{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.dmz-hero > svg path{fill:none;stroke:rgba(140,200,120,.16);stroke-width:.6}
.dmz-hero::after{content:"";position:absolute;inset:auto -20% -50% 30%;height:80%;z-index:-1;background:radial-gradient(closest-side,rgba(98,190,124,.22),transparent)}
.dmz-in{display:grid;gap:10px;padding:22px 20px}
.dmz-in .eyebrow{color:#A9C9A2}
.dmz-in h1{font-size:clamp(2.8rem,13vw,4rem);font-weight:800;color:#fff;letter-spacing:.02em}
.dmz-sub{color:#BFD0BB;max-width:46ch}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:4px}
.facts span{display:grid;gap:4px;padding:9px 10px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1)}
.facts small{font:500 .54rem/1.1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:#9FB59A}
.facts b{font:800 1rem/1.05 var(--f-display);text-transform:uppercase;letter-spacing:.02em;color:#ECF3EA}
.dep{display:grid;grid-template-columns:repeat(auto-fit,minmax(13rem,1fr));gap:8px}
.dcard{display:grid;gap:6px;align-content:start;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.dnum{font:700 .7rem/1 var(--f-mono);color:var(--buff)}
.dcard h3{font-size:1.3rem;font-weight:800}
.dcard p{color:var(--muted);font-size:.93rem}
.infil{display:grid;gap:6px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.inf{display:grid;grid-template-columns:8.4rem minmax(0,1fr) 4.6rem;gap:10px;align-items:center;padding:4px 0}
.inf-n{font-weight:600;font-size:.93rem}
.inf .bar{height:8px;border-radius:4px;background:var(--raised);overflow:hidden}
.inf .bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#3E8F55,#7FE09A)}
.inf-c{font:700 .92rem/1 var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.inf-c.free{color:var(--buff)}
.kvs{display:grid;gap:8px}
.kv{display:grid;gap:3px;padding:11px 13px;border-left:3px solid var(--accent);border-radius:4px 10px 10px 4px;background:var(--surface)}
.kv b{font-weight:700}
.kv p{color:var(--muted);font-size:.93rem}
.threats{display:grid;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));gap:8px}
