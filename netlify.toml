# Static site: no build step. Netlify publishes this folder as-is.
[build]
  publish = "."
  # Skip the deploy when a push only touches things the website doesn't use
  # (Discord bot, workflows, tests, tools, Supabase files, README). Each skipped
  # deploy saves Netlify credits. Site files and data/ still deploy as normal.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':!discord-bot' ':!.github' ':!tests' ':!tools' ':!supabase' ':!README.md'"

# Data changes often (patches, meta, shop), so always check for a fresh copy.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Images rarely change, so let phones cache them for a week.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# The offline helper must never be stale, or phones keep an old copy of the app.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

# Discord slash commands run as a Netlify Function at /api/discord.
[functions]
  directory = "netlify/functions"

# Keep the update scripts out of the public site.
[[redirects]]
  from = "/tools/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/discord-bot/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true
